<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Workline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
<style>
:root{
  --ink:#16211C; --ink-2:#2C3B34; --paper:#F4F6F2; --surface:#FFFFFF; --surface-2:#FAFBF8;
  --line:#DCE2DA; --line-2:#C6CFC2; --muted:#6B7570; --muted-2:#8B948A;
  --accent:#1F6F5C; --accent-soft:#E4F0EB; --accent-ink:#134A3D;
  --brass:#A8762C; --brass-soft:#F6EEDF; --accent-deep:#14523F;
  --ok:#2F7D4F; --ok-soft:#E5F2E9; --warn:#B8852B; --warn-soft:#FAF0DC; --crit:#A33A2E; --crit-soft:#F9E7E4;
  --navy:#1E3A5F; --navy-soft:#E4EAF1; --navy-ink:#fff;
  --shadow:0 1px 2px rgba(22,33,28,.06), 0 4px 16px rgba(22,33,28,.05);
  --r:10px; --r-sm:7px;
  --sans:"Poppins",ui-sans-serif,system-ui,"Segoe UI",sans-serif;
  --serif:"Poppins",ui-sans-serif,system-ui,"Segoe UI",sans-serif;
  --mono:"Poppins",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ink:#E8EDE7; --ink-2:#C3CCBF; --paper:#121714; --surface:#1A211D; --surface-2:#161D19;
  --line:#2C3631; --line-2:#3C4740; --muted:#96A096; --muted-2:#79837A;
  --accent:#4FB396; --accent-soft:#17312A; --accent-ink:#8FD8C2;
  --brass:#D6A55C; --brass-soft:#2E2417; --accent-deep:#2C7A64;
  --ok:#5FBF83; --ok-soft:#162C1D; --warn:#DCAB55; --warn-soft:#2E2413; --crit:#E0776A; --crit-soft:#331C18;
  --navy:#7FA8D9; --navy-soft:#1B2A3B; --navy-ink:#12202F;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.28);
}}
:root[data-theme="dark"]{
  --ink:#E8EDE7; --ink-2:#C3CCBF; --paper:#121714; --surface:#1A211D; --surface-2:#161D19;
  --line:#2C3631; --line-2:#3C4740; --muted:#96A096; --muted-2:#79837A;
  --accent:#4FB396; --accent-soft:#17312A; --accent-ink:#8FD8C2;
  --brass:#D6A55C; --brass-soft:#2E2417; --accent-deep:#2C7A64;
  --ok:#5FBF83; --ok-soft:#162C1D; --warn:#DCAB55; --warn-soft:#2E2413; --crit:#E0776A; --crit-soft:#331C18;
  --navy:#7FA8D9; --navy-soft:#1B2A3B; --navy-ink:#12202F;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent);text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
#shell{display:grid;grid-template-columns:212px 1fr;grid-template-rows:auto 1fr;height:100%;min-height:0}
#topbar{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:40;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;flex:0 0 auto;min-width:182px}
.brand .bt{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.logo{width:37px;height:25px;flex:0 0 auto}
.brand b{font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:-.02em}
.brand span{font-size:9.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap;margin-top:2px}
#qawrap{position:relative;width:100%}
#qa{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);transition:border-color .12s}
#qa:focus{border-color:var(--accent);background:var(--surface);outline:none}
#qawrap::before{content:"+";position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:17px;line-height:1;pointer-events:none}
#qahint{position:absolute;left:0;right:0;top:calc(100% + 5px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:9px 11px;box-shadow:var(--shadow);z-index:50;font-size:12.5px}
#qahint .t{font-weight:600;margin-bottom:5px}
.todaystamp{font-size:12.5px;color:var(--muted);white-space:nowrap}
.todaystamp b{color:var(--ink);font-weight:600}
.iconbtn{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-sm);width:31px;height:31px;display:grid;place-items:center;flex:0 0 auto;color:var(--muted)}
.iconbtn:hover{border-color:var(--accent);color:var(--accent)}
.iconbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#btn-sync{position:relative}
.syncdot{position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:99px;background:var(--muted-2);border:1.5px solid var(--surface)}
.syncdot.on{background:var(--ok)} .syncdot.off{background:var(--warn)} .syncdot.err{background:var(--crit)}
#btn-sync.spin svg{animation:syncspin .7s linear infinite}
@keyframes syncspin{to{transform:rotate(360deg)}}
.langseg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r-sm);overflow:hidden;flex:0 0 auto}
.langseg button{border:0;background:var(--surface);padding:6px 9px;font-size:11.5px;font-weight:600;color:var(--muted);border-right:1px solid var(--line)}
.langseg button:last-child{border-right:0}
.langseg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink)}

.timerchip{display:inline-flex;align-items:center;gap:7px;max-width:270px;padding:4px 11px;border:1px solid var(--accent);border-radius:99px;background:var(--accent-soft);color:var(--accent-ink);font-size:12px;font-weight:500;white-space:nowrap;flex:0 1 auto;min-width:0}
.timerchip i{width:7px;height:7px;border-radius:99px;background:var(--accent);flex:0 0 auto;animation:timerpulse 1.6s ease-in-out infinite}
.timerchip span{overflow:hidden;text-overflow:ellipsis;min-width:0}
.timerchip b{font-weight:600;flex:0 0 auto}
.timerchip em{font-style:normal;color:var(--muted);flex:0 0 auto}
@keyframes timerpulse{50%{opacity:.3}}
#rail{background:var(--surface);border-right:1px solid var(--line);padding:12px 10px;overflow-y:auto}
.navbtn{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border:0;border-radius:var(--r-sm);background:none;color:var(--ink-2);text-align:left;font-size:13.5px;margin-bottom:1px}
.navbtn svg{width:17px;height:17px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.8}
.navbtn:hover{background:var(--surface-2);color:var(--ink)}
.navbtn[aria-current="true"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.navbtn[aria-current="true"] svg{opacity:1}
.navsep{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted-2);padding:14px 10px 6px}
#main{overflow-y:auto;padding:20px 22px 64px;min-width:0}
.wrap{max-width:1180px;margin:0 auto}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px}
.card.flush{padding:0;overflow:hidden}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.page-h h1{font-size:23px}
.page-h .sub{color:var(--muted);font-size:13px;margin-top:2px}
.grid{display:grid;gap:12px}
.grid>*{min-width:0}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g-main{grid-template-columns:1.35fr 1fr}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px}
.tile .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tile .v{font-family:var(--mono);font-size:26px;font-weight:600;letter-spacing:-.02em;margin-top:5px;font-variant-numeric:tabular-nums}
.tile .n{font-size:12px;color:var(--muted);margin-top:1px}
.tile.accent .v{color:var(--accent)}
.tile.brass .v{color:var(--brass)}
h2.sec{font-size:15.5px;margin-bottom:9px;display:flex;align-items:center;gap:8px}
h2.sec .cnt{font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:500}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface);font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.08);color:#fff}
.btn.navy{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.btn.navy:hover{filter:brightness(1.08);color:var(--navy-ink)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.gho{border-color:transparent;background:none;color:var(--muted)}
.btn.gho:hover{background:var(--surface-2);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;gap:7px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-size:11.5px;font-weight:500;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap;max-width:230px;overflow:hidden;text-overflow:ellipsis}
.chip.acc{background:var(--accent-soft);border-color:transparent;color:var(--accent-ink)}
.chip.bra{background:var(--brass-soft);border-color:transparent;color:var(--brass)}
.chip.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.chip.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.chip.crit{background:var(--crit-soft);border-color:transparent;color:var(--crit)}
.empty{color:var(--muted);font-size:13px;padding:14px 2px;text-align:center}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar>i.ok{background:var(--ok)} .bar>i.warn{background:var(--warn)} .bar>i.crit{background:var(--crit)}
.muted{color:var(--muted)}
.tiny{font-size:12px}
.sepline{height:1px;background:var(--line);margin:12px 0}

/* ---------- lists ---------- */
.lrow{display:flex;align-items:flex-start;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow:hover{background:var(--surface-2)}
.lrow .body{flex:1;min-width:0}
.lrow .tt{font-weight:500;line-height:1.35;cursor:pointer}
.lrow .tt.done{text-decoration:line-through;color:var(--muted)}
.lrow .meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.lrow .side{display:flex;align-items:center;gap:7px;flex:0 0 auto}
.tick{width:17px;height:17px;border:1.6px solid var(--line-2);border-radius:5px;background:none;padding:0;flex:0 0 auto;margin-top:2px;display:grid;place-items:center}
.tick:hover{border-color:var(--accent)}
.tick[data-on="1"]{background:var(--accent);border-color:var(--accent)}
.tick[data-on="1"]::after{content:"";width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.gh{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:11px 14px 5px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.timecol{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}

/* ---------- forms ---------- */
.field{margin-bottom:11px}
.field>label{display:block;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:4px}
.inp,select.inp,textarea.inp{width:100%;padding:7px 10px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface-2)}
.inp:focus{border-color:var(--accent);background:var(--surface);outline:none}
textarea.inp{resize:vertical;min-height:62px;line-height:1.55}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.filters{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters .inp{width:auto;min-width:130px;padding:5px 8px;font-size:12.5px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r-sm);overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 11px;font-size:12.5px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}

/* ---------- drawer & modal ---------- */
#scrim{position:fixed;inset:0;background:rgba(18,23,20,.42);z-index:60;backdrop-filter:blur(1.5px)}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(470px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:61;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.14)}
#modal{position:fixed;z-index:61;top:50%;left:50%;transform:translate(-50%,-50%);width:min(720px,calc(100% - 28px));max-height:min(86vh,860px);background:var(--surface);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;box-shadow:0 18px 50px rgba(0,0,0,.22)}
.dhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line);flex:0 0 auto}
.dhead h3{font-size:16px}
.dbody{padding:15px 16px;overflow-y:auto;flex:1}
.dfoot{padding:11px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex:0 0 auto;flex-wrap:wrap}
.x{border:0;background:none;color:var(--muted);font-size:20px;line-height:1;padding:3px 7px;border-radius:6px}
.x:hover{background:var(--surface-2);color:var(--ink)}
.cfm-scrim{position:fixed;inset:0;background:rgba(18,23,20,.5);z-index:80}
.cfm-box{position:fixed;z-index:81;top:50%;left:50%;transform:translate(-50%,-50%);width:min(440px,calc(100% - 28px));background:var(--surface);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;box-shadow:0 18px 50px rgba(0,0,0,.28)}

/* ---------- timeline ---------- */
.tl{position:relative;border-left:1px solid var(--line);margin-left:52px;padding:4px 0}
.tlrow{position:relative;padding:3px 0 3px 15px;min-height:30px}
.tlrow .hh{position:absolute;left:-52px;width:44px;text-align:right;font-family:var(--mono);font-size:11.5px;color:var(--muted-2);top:4px}
.tlblock{border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--r-sm);padding:7px 10px;background:var(--surface-2);margin:2px 0}
.tlblock.done{border-left-color:var(--ok)} .tlblock.hold{border-left-color:var(--warn)}
.tlblock.cancel{border-left-color:var(--line-2);opacity:.6} .tlblock.meet{border-left-color:var(--brass)}
.tlblock .tt{font-weight:500;font-size:13.5px}

/* ---------- calendar ---------- */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--line)}
.cal .dow{background:var(--surface-2);padding:7px 8px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:center}
.cday{background:var(--surface);min-height:88px;min-width:0;overflow:hidden;padding:5px 6px;text-align:left;border:0;display:flex;flex-direction:column;gap:3px;align-items:stretch}
.cday>*{flex:0 0 auto}
.cal.m .cday{min-height:92px;max-height:116px}
.cal.w .cday{min-height:150px;max-height:200px}
.cday:hover{background:var(--surface-2)}
.cday.out{background:var(--surface-2);opacity:.5}
.cday[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--accent)}
.cday .dn{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.cday.today .dn{background:var(--accent);color:#fff;border-radius:99px;width:20px;height:20px;display:grid;place-items:center;font-weight:600}
.dot{min-width:0;max-width:100%;font-size:10.5px;line-height:1.35;padding:1px 4px;border-radius:4px;background:var(--accent-soft);color:var(--accent-ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot.meet{background:var(--brass-soft);color:var(--brass)}
.dot.dl{background:var(--crit-soft);color:var(--crit)}
.dot .sfx{font-style:normal}
.dot.more{background:none;color:var(--muted);padding-left:0;font-weight:600}

/* ---------- charts ---------- */
.hbar{display:grid;grid-template-columns:minmax(120px,190px) 1fr auto;gap:10px;align-items:center;padding:5px 0;font-size:12.5px}
.hbar .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.hbar .vl{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.chartbox{overflow-x:auto}
svg.heat{display:block;width:100%;height:auto;min-width:340px}
.heat text{font-family:var(--mono);font-size:10px;fill:var(--muted)}
.stackbar{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--line);gap:2px}
.stackbar>i{display:block;height:100%}
.legrow{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:4px 0}
.legrow .sw{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
.legrow .vl{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
svg.chart{display:block;width:100%;height:auto;min-width:420px}
.chart text{font-family:var(--mono);font-size:9.5px;fill:var(--muted)}

/* ---------- misc ---------- */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:99px;font-size:13px;z-index:90;box-shadow:var(--shadow);max-width:88vw}
.pill{display:inline-block;padding:1px 7px;border-radius:99px;font-size:11px;font-weight:600;background:var(--brass-soft);color:var(--brass)}
.gen{background:var(--surface-2);border:1px dashed var(--line-2);border-radius:var(--r);padding:12px 13px}
.gen h4{font-family:var(--sans);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.outbox{width:100%;font-family:var(--mono);font-size:12.5px;line-height:1.7;min-height:118px}
.countline{display:flex;gap:12px;font-size:11.5px;color:var(--muted);margin-top:5px;font-family:var(--mono)}
.countline b.bad{color:var(--crit)}
.countline b.brass{color:var(--brass)}
.countline b.navy{color:var(--navy)}
.countline b.warnc{color:var(--warn)}

/* ---------- kanban ---------- */
.kanban{display:grid;grid-template-columns:repeat(5,minmax(150px,1fr));gap:10px;overflow-x:auto;padding-bottom:4px}
.kancol{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:8px;min-height:120px;display:flex;flex-direction:column;gap:6px}
.kancol.over{border-color:var(--accent);background:var(--accent-soft)}
.kanhead{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:11px;letter-spacing:.04em;font-weight:600;color:var(--muted);padding:2px 4px 6px;border-bottom:1px solid var(--line);margin-bottom:2px}
.kancard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 9px;cursor:grab}
.kancard:hover{border-color:var(--accent)}
.kancard:active{cursor:grabbing}

/* ---------- gantt ---------- */
.gantt{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ganttaxis{display:flex;justify-content:space-between;padding:5px 12px;background:var(--surface-2);border-bottom:1px solid var(--line);font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.ganttrow{display:grid;grid-template-columns:180px 1fr 100px;align-items:center;gap:8px;padding:5px 12px;border-bottom:1px solid var(--line)}
.ganttrow:last-child{border-bottom:0}
.ganttrow:hover{background:var(--surface-2)}
.ganttlabel{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.gantttrack{position:relative;height:16px;background:var(--surface-2);border-radius:4px}
.ganttbar{position:absolute;top:2px;height:12px;border-radius:4px;background:var(--accent);min-width:8px;cursor:pointer}
.ganttbar.ok{background:var(--ok)} .ganttbar.warn{background:var(--warn)} .ganttbar.crit{background:var(--crit)} .ganttbar.cancel{background:var(--line-2)}
.ganttdot{position:absolute;top:1px;width:14px;height:14px;background:var(--brass);transform:translateX(-50%) rotate(45deg);border-radius:2px;cursor:pointer}
.ganttdate{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap;text-align:right}
@media (max-width:860px){ .ganttrow{grid-template-columns:130px 1fr 78px} }
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{text-align:left;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--surface-2);vertical-align:bottom}
table.t td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
.srch-res{max-height:60vh;overflow-y:auto}

@media (max-width:1040px){ .g4{grid-template-columns:repeat(2,1fr)} .g-main{grid-template-columns:1fr} .g3{grid-template-columns:1fr 1fr} }
@media (max-width:860px){
  #shell{grid-template-columns:1fr}
  #rail{position:fixed;left:0;right:0;bottom:0;top:auto;border-right:0;border-top:1px solid var(--line);display:flex;gap:2px;overflow-x:auto;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:45}
  .navsep{display:none}
  .navbtn{flex-direction:column;gap:3px;font-size:10.5px;padding:5px 9px;width:auto;white-space:nowrap}
  #main{padding:16px 16px 92px}
  .brand{min-width:0} .g2,.g3,.f2,.f3{grid-template-columns:1fr}
}
@media (max-width:520px){ .cal.m .dot .sfx{display:none} .cal.m .dot{text-align:center} }
@media (max-width:460px){ .g4{grid-template-columns:1fr 1fr} .page-h h1{font-size:20px} }
/* ---------- motion (v2.1) ---------- */
:root{--ease:cubic-bezier(.22,1,.36,1);--ease-out:cubic-bezier(.16,1,.3,1);--t-fast:.13s;--t-mid:.22s}
button,.lrow,.cday,.kancard,.chip,.ganttrow{-webkit-tap-highlight-color:transparent}
.btn,.iconbtn,.navbtn,.x,.tick,.seg button,.langseg button,.timerchip{position:relative;overflow:hidden;transition:transform var(--t-fast) var(--ease),background-color var(--t-fast) linear,border-color var(--t-fast) linear,color var(--t-fast) linear,box-shadow var(--t-mid) var(--ease)}
.btn:active:not(:disabled),.x:active,.seg button:active,.langseg button:active,.timerchip:active{transform:scale(.955)}
.iconbtn:active,.navbtn:active{transform:scale(.93)}
.tick:active{transform:scale(.86)}
.btn.pri:active:not(:disabled),.btn.navy:active:not(:disabled){box-shadow:inset 0 2px 9px rgba(0,0,0,.2)}
.lrow,.ganttrow{transition:background-color var(--t-fast) linear}
.lrow:active,.ganttrow:active{background:var(--surface-2)}
.cday{position:relative;transition:background-color var(--t-fast) linear,transform var(--t-fast) var(--ease)}
.cday:active{transform:scale(.97)}
.kancard{transition:transform var(--t-fast) var(--ease),border-color var(--t-fast) linear,box-shadow var(--t-mid) var(--ease)}
.kancard:active{transform:scale(.975)}
.card,.tile{transition:border-color var(--t-mid) var(--ease),box-shadow var(--t-mid) var(--ease)}
.bar>i{transition:width .45s var(--ease)}
/* Riak tekan. Elemennya dibuat & dibuang oleh JS, jadi tidak pernah menumpuk di DOM. */
.ripple{position:absolute;border-radius:50%;pointer-events:none;background:currentColor;opacity:.16;transform:scale(0);animation:ripple .5s var(--ease-out) forwards}
@keyframes ripple{to{transform:scale(1);opacity:0}}
/* Overlay dipakai ulang (hidden di-toggle), bukan dibuat baru — animasinya tidak akan jalan
   lagi kecuali kelasnya dipasang ULANG. Itu tugas animUlang(); di sini cuma definisinya. */
#scrim.anim{animation:mfade .18s ease both}
#drawer.anim{animation:mslide .26s var(--ease) both}
#modal.anim{animation:mpop .22s var(--ease) both}
#toast.anim{animation:mtoast .26s var(--ease) both}
.cfm-scrim{animation:mfade .15s ease both}
.cfm-box{animation:mpop .18s var(--ease) both}
@keyframes mfade{from{opacity:0}to{opacity:1}}
@keyframes mslide{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
@keyframes mpop{from{transform:translate(-50%,-50%) scale(.96);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
@keyframes mtoast{from{transform:translateX(-50%) translateY(12px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}
/* Masuk bertahap HANYA saat pindah tab. render() jalan tiap ketukan tombol di filter —
   kalau kelas ini menetap, seluruh halaman akan berkedip tiap huruf yang diketik. */
#view.swap>*{animation:mpage .3s var(--ease) both}
#view.swap>*:nth-child(2){animation-delay:.045s}
#view.swap>*:nth-child(3){animation-delay:.09s}
#view.swap>*:nth-child(4){animation-delay:.135s}
#view.swap>*:nth-child(n+5){animation-delay:.17s}
@keyframes mpage{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
/* ---------- splash ---------- */
#splash{position:fixed;inset:0;z-index:200;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;text-align:center;padding:24px;transition:opacity .5s ease}
#splash.out{opacity:0;pointer-events:none}
#splash .slogo{width:135px;height:90px;margin-bottom:14px;overflow:hidden}
#splash .slogo use{transform-box:fill-box;animation:splashbar 1s cubic-bezier(.16,1,.3,1) both}
#splash .slogo use:nth-child(3){animation-delay:.1s}
#splash .slogo use:nth-child(2){animation-delay:.45s}
#splash .slogo use:nth-child(1){animation-delay:.8s}
#splash .sname{font-family:var(--serif);font-size:30px;font-weight:700;letter-spacing:-.02em;animation:splashtxt .8s 1.5s cubic-bezier(.16,1,.3,1) both}
#splash .ssub{font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);animation:splashtxt .8s 1.7s cubic-bezier(.16,1,.3,1) both}
#splash .stag{max-width:34ch;margin-top:10px;font-size:13px;line-height:1.55;color:var(--ink-2);animation:splashtxt .8s 1.95s cubic-bezier(.16,1,.3,1) both}
#splash .sver{margin-top:16px;font-family:var(--mono);font-size:11px;color:var(--muted-2);animation:splashtxt .8s 2.2s cubic-bezier(.16,1,.3,1) both}
/* opacity aman di sini: bila animasi dimatikan (reduced-motion) gaya dasar opacity:1 yang berlaku */
@keyframes splashbar{from{transform:translateX(-48px);opacity:0}to{transform:none;opacity:1}}
@keyframes splashtxt{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }

/* Overlay dipakai ulang (hanya atribut hidden yang di-toggle), jadi animasi CSS-nya tidak
   akan jalan lagi kecuali kelasnya dilepas, layout dipaksa hitung ulang, lalu dipasang ulang. */
function animUlang(el){ if(!el||REDUCED.matches)return; el.classList.remove("anim"); void el.offsetWidth; el.classList.add("anim"); }

function iso(d){return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate());}
function fromISO(s){const a=String(s||"").split("-");return new Date(+a[0],+a[1]-1,+a[2]);}
function todayISO(){return iso(new Date());}
function addDays(s,n){const d=fromISO(s);d.setDate(d.getDate()+n);return iso(d);}
function diffDays(a,b){return Math.round((fromISO(b)-fromISO(a))/864e5);}
function fmtTgl(s,mode){if(!s)return"—";const d=fromISO(s);const H=hariArr(),B=bulanArr(),BS=bulanSArr();if(mode==="long")return H[d.getDay()]+", "+d.getDate()+" "+B[d.getMonth()]+" "+d.getFullYear();if(mode==="mid")return d.getDate()+" "+BS[d.getMonth()]+" "+d.getFullYear();return d.getDate()+" "+BS[d.getMonth()];}
function toMin(t){if(!t)return null;const m=String(t).match(/^(\d{1,2}):(\d{2})$/);return m?(+m[1])*60+(+m[2]):null;}
function fmtDur(m){if(!m||m<=0)return"—";const h=Math.floor(m/60),x=m%60;return h?(h+"j"+(x?" "+x+"m":"")):(x+"m");}
function durasi(t){const a=toMin(t.jam_mulai),b=toMin(t.jam_selesai);return(a!=null&&b!=null&&b>a)?b-a:0;}
function triwulan(s){return Math.ceil((+String(s).slice(5,7))/3);}
function slug(s){return String(s||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");}
function norm(s){return String(s||"").toLowerCase();}
function debounce(fn,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms);};}

/* Hapus = pindah ke Kotak Sampah, bukan lenyap. Dokumen aslinya disalin UTUH supaya
   pemulihan mengembalikan id yang sama dan relasi project_id/event_id/meeting_id tetap nyambung.
   Kalau penghapusan di server gagal, catatan sampahnya ikut ditarik kembali — kalau tidak,
   akan tertinggal entri sampah yang menunjuk dokumen yang sebenarnya masih hidup. */
async function drop(c,id){
  const backup=D[c].get(id);
  let tid="";
  if(backup&&COLLS_DATA.indexOf(c)>=0){
    tid="x_"+c+"_"+id;
    const rec={id:tid,doc_id:id,koleksi:c,judul:judulDoc(c,backup),tanggal:backup.tanggal||"",
      dihapus_pada:new Date().toISOString(),data:backup};
    D.trash.set(tid,rec); lsSet("trash");
    if(db){ try{ await db.doc("trash/"+tid).set(rec); }catch(e){} }
  }
  D[c].delete(id); lsSet(c); render();
  if(db){ try{ await db.doc(c+"/"+id).delete(); }catch(e){
    if(backup){ D[c].set(id,backup); lsSet(c); }
    if(tid)await buangSampah(tid);
    render();
    toast(e.code==="invalid_argument"?L("toast.writeDenied"):L("toast.saveFailedPrefix")+(e.code||"?")+").");
  } }
}

/* ============================ GAYA BAHASA (Simpan Revisi) ============================
   Kamus frasa deterministik: baris draf -> baris versi pengguna. Hanya cocok PERSIS,
   tidak pernah menebak, dan dipakai tanpa AI sehingga tetap jalan saat kuota habis. */
function normGaya(s){ return String(s==null?"":s).replace(/^\s*\d+[.)]\s*/,"").trim().replace(/\s+/g," "); }
function normBlok(s){ return String(s==null?"":s).split("\n").map(normGaya).filter(Boolean).join("\n"); }
function terapkanGaya(teks){
  const g=META.gaya||[]; if(!g.length)return teks;
  const awal=normGaya(teks);
  let k=awal;
  /* Rantai pendek (A->B lalu B->C) diratakan saat disimpan, tapi batas lompatan tetap
     dipasang supaya pasangan melingkar tidak pernah bisa mengunci loop ini. */
  for(let hop=0;hop<4;hop++){
    let ganti=null;
    for(let i=g.length-1;i>=0;i--){ if(g[i].dari===k){ ganti=normGaya(g[i].ke); break; } }
    if(ganti==null||ganti===k)break;
    k=ganti;
  }
  return k===awal?teks:k;
}
async function simpanRevisi(){
  const el=$("#presensi-out");
  const revisi=el?el.value:UI.gen.presensi;
  const draf=UI.gen.draf||"";
  if(!draf){ toast(L("toast.revNoDraft")); return; }
  const a=normBlok(draf).split("\n").filter(Boolean);
  const b=normBlok(revisi).split("\n").filter(Boolean);
  /* Kalau jumlah barisnya beda, pasangan draf-revisi bergeser dan yang dipelajari jadi salah.
     Lebih baik menolak dan bilang alasannya daripada mengajarkan pasangan yang keliru. */
  if(a.length!==b.length){ toast(L("toast.revLineMismatch")); return; }
  const gaya=(META.gaya||[]).map(x=>Object.assign({},x));
  const kini=new Date().toISOString();
  let n=0;
  for(let i=0;i<a.length;i++){
    const dari=a[i], ke=b[i];
    if(!dari||!ke||dari===ke)continue;
    let kena=false;
    /* Draf ini mungkin sendirinya hasil pelajaran sebelumnya. Perbarui pelajaran itu
       alih-alih menumpuk rantai baru, supaya kamusnya tetap datar. */
    gaya.forEach(g=>{ if(normGaya(g.ke)===dari){ g.ke=ke; g.pada=kini; kena=true; } });
    const idx=gaya.findIndex(g=>g.dari===dari);
    if(idx>=0){ gaya[idx]={dari:dari,ke:ke,pada:kini}; kena=true; }
    else if(!kena){ gaya.push({dari:dari,ke:ke,pada:kini}); }
    n++;
  }
  if(!n){ toast(L("toast.revNoChange")); return; }
  META.gaya=gaya.slice(-GAYA_MAX);
  await putMeta();
  UI.gen.presensi=revisi; UI.gen.draf=revisi;
  toast(L("toast.revSavedPrefix")+n+L("toast.revSavedSuffix"));
  openModal(tutupHariHTML(UI.date,false));
}

   '<div class="tiny muted" style="margin-bottom:10px;max-width:64ch">'+esc(L("gaya.desc"))+'</div>'+

/* ============================ selectors ============================ */
const tasks=()=>[...D.tasks.values()];
const projects=()=>[...D.projects.values()].sort((a,b)=>String(a.nama).localeCompare(String(b.nama)));
const meetings=()=>[...D.meetings.values()].sort((a,b)=>String(b.tanggal).localeCompare(String(a.tanggal)));
const events=()=>[...D.events.values()];
function indikators(){
  const out=[];
  [...D.skp.values()].sort((a,b)=>(a.jenis===b.jenis? a.no-b.no : (a.jenis==="utama"?-1:1)))
    .forEach(r=>(r.indikator||[]).forEach(i=>out.push(Object.assign({},i,{rhkId:r.id,rhk:r.rhk,rhk_atasan:r.rhk_atasan,no:r.no,jenis:r.jenis}))));
  return out;
}
const indById=id=>indikators().find(i=>i.id===id)||null;
const projById=id=>D.projects.get(id)||null;
const labelProject=id=>{const p=projById(id);return p?p.nama:"";};
function labelInd(id){const i=indById(id);return i?((i.jenis==="tambahan"?pfxT():"")+i.no+" · "+i.indikator):"";}
function tasksOn(dt){return tasks().filter(t=>t.tanggal===dt).sort((a,b)=>(toMin(a.jam_mulai)??1e4)-(toMin(b.jam_mulai)??1e4));}
function eventsOn(dt){return events().filter(e=>e.tanggal===dt).sort((a,b)=>(toMin(a.jam_mulai)??1e4)-(toMin(b.jam_mulai)??1e4));}
function meetingsOn(dt){return meetings().filter(m=>m.tanggal===dt);}
const urutJam=(a,b)=>(toMin(a.jam_mulai)??1e4)-(toMin(b.jam_mulai)??1e4);
function tglLokal(s){ const d=new Date(s); return isNaN(d.getTime())?"":iso(d); }
/* "Bawa ke hari ini": penanda satu-tanggal (bawa_tanggal) — kedaluwarsa sendiri saat hari berganti.
   TIDAK PERNAH mengubah t.tanggal (hari rencana; dasar periode SKP/EKP). */
function tasksDibawa(dt){ return tasks().filter(t=>t.bawa_tanggal===dt&&t.tanggal!==dt); }
function tasksHariIni(dt){ return tasksOn(dt).concat(tasksDibawa(dt)).sort(urutJam); }
/* Predikat "benar-benar dikerjakan pada dt" — dasar Rekap Presensi. Ditandai saja tidak pernah cukup. */
function dikerjakanPada(t,dt){
  if(t.status==="Selesai")return t.selesai_pada?tglLokal(t.selesai_pada)===dt:t.tanggal===dt;
  if(t.status==="Berjalan")return t.tanggal===dt||t.bawa_tanggal===dt;
  return false;
}
function kandidatPresensi(dt){ return tasks().filter(t=>dikerjakanPada(t,dt)).sort(urutJam); }
/* Agenda & notulensi sebagai sumber baris rekap (v2.1).
   Agenda: semua jenis KECUALI Deadline (tenggat bukan kegiatan yang dihadiri).
   Penyaringnya BUKAN "harus Terlaksana": status bawaan agenda adalah "Terjadwal" dan pada
   praktiknya jarang diubah, jadi menuntut "Terlaksana" justru akan menghapus baris rapat
   yang benar-benar terjadi. Yang dibuang hanya agenda yang tegas dinyatakan tidak jadi —
   sebelum v2.1 rapat batal pun masih ikut naik ke rekap. */
function agendaDihitung(dt){
  return eventsOn(dt).filter(e=>e.jenis!=="Deadline"&&e.status!=="Dibatalkan"&&e.status!=="Ditunda");
}
function notulensiBerisi(m){
  if(!m)return false;
  return !!((m.pokok&&m.pokok.length)||(m.keputusan&&m.keputusan.length)||
    (m.tindak_lanjut&&m.tindak_lanjut.length)||String(m.kesimpulan||"").trim());
}
function notulensiUntuk(e){
  if(!e)return null;
  if(e.meeting_id&&D.meetings.get(e.meeting_id))return D.meetings.get(e.meeting_id);
  return meetings().find(m=>m.event_id===e.id)||null;
}
function frasaRapat(judul,adaNotulensi){
  const inti=String(judul||"").trim().replace(/^rapat\s*/i,"");
  return "Mengikuti rapat "+inti+(adaNotulensi?" dan menyusun notulensinya":"");
}
/* Notulensi TIDAK jadi baris sendiri: ia digabung ke baris rapatnya. Jatah rekap cuma
   5 baris, jadi memecah satu rapat jadi dua baris akan menggusur pekerjaan lain. */
function kegiatanHari(dt){
  const out=[], dipakai=new Set();
  agendaDihitung(dt).forEach(e=>{
    const m=notulensiUntuk(e), ada=notulensiBerisi(m);
    if(m)dipakai.add(m.id);
    const teks=(e.jenis==="Rapat")?frasaRapat(e.judul,ada)
      :(frasaKerja(e.judul)+(ada?" serta menyusun notulensinya":""));
    out.push({teks:teks,kunci:e.judul,skor:9000+(ada?60:0)});
  });
  /* Notulensi yang tidak tertampung agenda mana pun tetap dilaporkan — kecuali agenda yang
     ditautkannya memang batal atau ditunda, karena berarti rapatnya tidak pernah terjadi. */
  meetingsOn(dt).forEach(m=>{
    if(dipakai.has(m.id))return;
    const ev=m.event_id?D.events.get(m.event_id):null;
    if(ev&&(ev.status==="Dibatalkan"||ev.status==="Ditunda"))return;
    out.push({teks:frasaRapat(m.judul,notulensiBerisi(m)),kunci:m.judul,skor:8900});
  });
  return out;
}
/* Satu sumber kebenaran untuk Rekap Presensi, Kesimpulan Kegiatan, dan umpan ke AI —
   sebelum v2.1 ketiganya memungut kegiatan dengan cara yang berbeda-beda. */
function itemRekap(dt){
  const kandidat=kandidatPresensi(dt);
  const sudah=k=>kandidat.some(t=>norm(t.judul).includes(norm(String(k||"").slice(0,14))));
  return {kandidat:kandidat, keg:kegiatanHari(dt).filter(k=>!sudah(k.kunci))};
}
function ringkasHari(dt,bawaan){
  const ts=bawaan?tasksHariIni(dt):tasksOn(dt), ev=eventsOn(dt);
  const sel=ts.filter(t=>t.status==="Selesai"), jal=ts.filter(t=>t.status==="Berjalan");
  const tun=ts.filter(t=>t.status==="Ditunda"), bat=ts.filter(t=>t.status==="Dibatalkan");
  const menit=ts.reduce((s,t)=>s+durasi(t),0);
  return {ts,ev,sel,jal,tun,bat,menit,rapat:ev.filter(e=>e.jenis==="Rapat")};
}
function periodeRange(p){
  const y=+String(p).slice(0,4);
  if(/TW/.test(p)){const q=+p.slice(-1);return{from:y+"-"+p2((q-1)*3+1)+"-01",to:iso(new Date(y,q*3,0)),label:"TW "+["I","II","III","IV"][q-1]+" "+y};}
  return{from:y+"-01-01",to:y+"-12-31",label:"Tahun "+y};
}
function periodeOpsi(){
  const y=+todayISO().slice(0,4), out=[];
  for(let q=1;q<=4;q++)out.push(y+"-TW"+q);
  out.push(String(y));
  return out;
}
function tasksForInd(id,from,to){return tasks().filter(t=>t.indikator_id===id&&t.tanggal>=from&&t.tanggal<=to);}
function meetingsForInd(id,from,to){return meetings().filter(m=>m.indikator_id===id&&m.tanggal>=from&&m.tanggal<=to);}
function buktiForInd(id,from,to){const out=[];tasksForInd(id,from,to).forEach(t=>(t.bukti||[]).forEach(b=>out.push(Object.assign({},b,{dari:t.judul,tanggal:t.tanggal}))));meetingsForInd(id,from,to).forEach(m=>(m.lampiran||[]).forEach(b=>out.push(Object.assign({},b,{dari:m.judul,tanggal:m.tanggal}))));return out;}

/* Realisasi deterministik — jantung SKP & EKP. Tidak pernah dikarang AI. */
function hitungRealisasi(ind,from,to){
  const tsAll=tasksForInd(ind.id,from,to);
  const ts=tsAll.filter(t=>t.status==="Selesai");
  const ms=meetingsForInd(ind.id,from,to);
  const bk=buktiForInd(ind.id,from,to);
  const r={nilai:0,satuan:ind.target_satuan,teks:"",n_task:tsAll.length,n_selesai:ts.length,n_meeting:ms.length,n_bukti:bk.length,sumber:{tasks:tsAll,meetings:ms,bukti:bk},ada:false};
  switch(ind.metode){
    case "COUNT_TASK": r.nilai=ts.length; break;
    case "COUNT_MEETING": r.nilai=ms.length; break;
    case "COUNT_EVIDENCE": r.nilai=bk.length; break;
    case "SUM_JAM": r.nilai=Math.round(ts.reduce((s,t)=>s+durasi(t),0)/60*10)/10; break;
    case "DURASI_HARI":{
      const tg=tsAll.map(t=>t.tanggal).sort();
      const sl=ts.map(t=>t.selesai_pada?tglLokal(t.selesai_pada):t.tanggal).sort();
      r.nilai=(tg.length&&sl.length)?Math.max(1,diffDays(tg[0],sl[sl.length-1])+1):0; r.satuan="Hari"; break;}
    case "PERSEN_TRIWULAN":{
      const twAda=new Set(ts.map(t=>triwulan(t.tanggal)));
      const q0=triwulan(from), q1=triwulan(to);
      const qNow=Math.min(q1,triwulan(todayISO().slice(0,4)===from.slice(0,4)?todayISO():to));
      const total=Math.max(1,qNow-q0+1);
      let ter=0; for(let q=q0;q<=qNow;q++) if(twAda.has(q)) ter++;
      r.nilai=Math.round(ter/total*100); r.satuan="%"; r.tw_terlapor=ter; r.tw_total=total; break;}
    default: r.nilai=ind.manual_nilai||0;
  }
  r.ada = r.n_task>0||r.n_meeting>0||r.n_bukti>0;
  return r;
}
const SATUAN_HITUNG={COUNT_TASK:"aktivitas",COUNT_MEETING:"rapat",COUNT_EVIDENCE:"bukti",SUM_JAM:"jam",DURASI_HARI:"hari",PERSEN_TRIWULAN:"%"};
const SATUAN_HITUNG_EN={COUNT_TASK:"activities",COUNT_MEETING:"meetings",COUNT_EVIDENCE:"evidence",SUM_JAM:"hours",DURASI_HARI:"days",PERSEN_TRIWULAN:"%"};
function satuanHitung(metode){return (LANG==="en"?SATUAN_HITUNG_EN:SATUAN_HITUNG)[metode]||"";}
function nilaiUtama(ind,r){ return (ind.metode==="COUNT_EVIDENCE")? r.n_bukti : r.nilai; }
function tampilRealisasi(ind,r){
  const n=nilaiUtama(ind,r);
  if(ind.target_satuan==="Indeks") return n+" "+satuanHitung(ind.metode);
  return n+" "+(r.satuan||"");
}
function kalimatRealisasi(ind,r,labelPeriode){
  const tpl=ind.template_realisasi;
  const n = nilaiUtama(ind,r);
  if(!r.ada||!n) return "Data belum tersedia.";
  if(tpl) return tpl.replace(/\{periode\}/g,labelPeriode).replace(/\{n\}/g,String(n)).replace(/\{satuan\}/g,r.satuan||"").replace(/\{m\}/g,String(r.n_meeting)).replace(/\{tw\}/g,String(r.tw_terlapor||0));
  return n+" "+(r.satuan||"");
}
function statusCapaian(ind,r){
  const t=+ind.target_nilai||0;
  if(!r.ada) return {k:"crit",l:L("skp.statusNoData")};
  if(ind.target_satuan==="Indeks"){const n=nilaiUtama(ind,r);return n?{k:"acc",l:n+" "+(satuanHitung(ind.metode)||L("skp.statusRecorded"))}:{k:"crit",l:L("skp.statusNoData")};}
  if(ind.metode==="DURASI_HARI"){const lim=ind.target_satuan==="Bulan"?t*30:(ind.target_satuan==="Minggu"?t*7:t);return r.nilai<=lim?{k:"ok",l:L("skp.statusOnTime")}:{k:"warn",l:L("skp.statusOverTarget")};}
  const pct=t?r.nilai/t:0;
  if(pct>=1)return{k:"ok",l:L("skp.statusAchieved")};
  if(pct>=.5)return{k:"warn",l:L("skp.statusInProgress")};
  return{k:"crit",l:L("skp.statusAtRisk")};
}
function persenCapaian(ind,r){
  const t=+ind.target_nilai||0;
  if(ind.target_satuan==="Indeks"){const n=nilaiUtama(ind,r);return clamp(n?55+Math.min(45,n*5):0,0,100);}
  if(ind.metode==="DURASI_HARI"){const lim=ind.target_satuan==="Bulan"?t*30:(ind.target_satuan==="Minggu"?t*7:t);return r.nilai?clamp(Math.round(lim/Math.max(r.nilai,1)*100),0,100):0;}
  return t?clamp(Math.round(r.nilai/t*100),0,100):0;
}
function progressProject(p){
  const ts=tasks().filter(t=>t.project_id===p.id&&t.status!=="Dibatalkan");
  const sel=ts.filter(t=>t.status==="Selesai").length;
  const auto=ts.length?Math.round(sel/ts.length*100):(+p.progress||0);
  return {total:ts.length,selesai:sel,pct:(p.progress_manual!=null? +p.progress_manual : auto)};
}

let toastT;
function toast(msg){const el=$("#toast");const baru=el.hidden;el.textContent=msg;el.hidden=false;if(baru)animUlang(el);clearTimeout(toastT);toastT=setTimeout(()=>{el.hidden=true;},3200);}

/* ============================ splash ============================
   Pembubaran murni berbasis timer — JANGAN pakai animationend/transitionend: aturan
   prefers-reduced-motion mematikan animasi sehingga event itu tidak pernah datang.
   Tiga lapis independen: (1) paint() pertama + double-rAF, min SPLASH_MIN; (2) batas SPLASH_MAX
   dari boot(); (3) setTimeout inline 7500 ms di markup, hidup walau seluruh script mati. */
let splashDone=false, splashArmed=false;
function splashTutup(){
  if(splashDone)return; splashDone=true;
  const el=document.getElementById("splash"); if(!el)return;
  el.classList.add("out");
  setTimeout(()=>{ if(el.parentNode)el.parentNode.removeChild(el); },560);

function timerAktif(){
  const hi=todayISO(), now=new Date(), nowMin=now.getHours()*60+now.getMinutes();
  const run=tasks().filter(t=>t.status==="Berjalan");
  if(!run.length)return null;
  const skor=t=>(t.tanggal===hi?2:(t.bawa_tanggal===hi?1:0))*10000+(toMin(t.jam_mulai)??0);
  run.sort((a,b)=>skor(b)-skor(a));
  const t=run[0], m=toMin(t.jam_mulai);
  return {t,menit:(t.tanggal===hi&&m!=null&&nowMin>=m)?nowMin-m:null,lain:run.length-1};
}
function paintTimer(){
  const el=$("#timer-chip"); if(!el)return;

/* ============================ TO-DO LIST ============================ */
function filterTasks(){
  const f=UI.f, q=norm(f.q), dt=todayISO();
  return tasks().filter(t=>{
    if(f.status&&t.status!==f.status)return false;
    if(f.prioritas&&t.prioritas!==f.prioritas)return false;
    if(f.kategori&&t.kategori!==f.kategori)return false;
    if(f.project&&t.project_id!==f.project)return false;
    if(f.indikator&&t.indikator_id!==f.indikator)return false;
    if(f.rentang==="hari"&&t.tanggal!==dt)return false;
    if(f.rentang==="minggu"&&(t.tanggal<addDays(dt,-6)||t.tanggal>addDays(dt,7)))return false;
    if(f.rentang==="bulan"&&String(t.tanggal).slice(0,7)!==dt.slice(0,7))return false;
    if(f.rentang==="aktif"&&(t.status==="Selesai"||t.status==="Dibatalkan"))return false;
    if(q&&!(norm(t.judul)+" "+norm(t.deskripsi)+" "+norm(t.output)+" "+norm(t.catatan)+" "+norm(labelProject(t.project_id))).includes(q))return false;
    return true;
  });
}

function ganttCls(status){return status==="Selesai"?"ok":status==="Ditunda"?"warn":status==="Dibatalkan"?"cancel":"";}
function projectGantt(p,ts){
  const items=[];
  ts.forEach(t=>{ if(!t.tanggal)return; const end=(t.deadline&&t.deadline>t.tanggal)?t.deadline:t.tanggal;
    items.push({kind:"task",id:t.id,label:t.judul,start:t.tanggal,end:end,status:t.status}); });
  (p.milestone||[]).forEach(m=>{ if(!m.tanggal)return; items.push({kind:"milestone",label:m.nama,start:m.tanggal,end:m.tanggal,selesai:m.selesai}); });
  if(!items.length) return '<div class="card"><div class="empty">'+esc(L("proj.ganttEmpty"))+'</div></div>';
  items.sort((a,b)=>String(a.start).localeCompare(String(b.start)));
  const allDates=items.reduce((a,x)=>a.concat([x.start,x.end]),[]);
  const lo=addDays(allDates.reduce((a,b)=>a<b?a:b),-1), hi=addDays(allDates.reduce((a,b)=>a>b?a:b),1);
  const span=Math.max(1,diffDays(lo,hi));
  const pos=x=>clamp(diffDays(lo,x)/span*100,0,100);
  const rows=items.map(x=>{
    const l=pos(x.start), r=pos(x.end), w=Math.max(r-l,1.2);
    const inner=x.kind==="milestone"
      ?'<div class="ganttdot" style="left:'+l.toFixed(2)+'%" title="'+esc(x.label)+'"></div>'
      :'<div class="ganttbar '+ganttCls(x.status)+'" style="left:'+l.toFixed(2)+'%;width:'+w.toFixed(2)+'%" data-act="open-task" data-id="'+x.id+'" title="'+esc(x.label)+'"></div>';
    return '<div class="ganttrow">'+
      '<div class="ganttlabel" title="'+esc(x.label)+'"'+(x.kind==="task"?' data-act="open-task" data-id="'+x.id+'"':"")+'>'+(x.kind==="milestone"?"&#9670; ":"")+esc(x.label)+'</div>'+
      '<div class="gantttrack">'+inner+'</div>'+
      '<div class="ganttdate">'+esc(fmtTgl(x.start,"mid"))+(x.end!==x.start?"–"+esc(fmtTgl(x.end,"mid")):"")+'</div>'+
    '</div>';
  }).join("");
  return '<div class="gantt"><div class="ganttaxis"><span>'+esc(fmtTgl(lo,"mid"))+'</span><span>'+esc(fmtTgl(hi,"mid"))+'</span></div>'+rows+'</div>'+
    '<div class="tiny muted" style="margin-top:8px">&#9670; '+esc(L("proj.ganttMilestones"))+'</div>';
}

function arsipEligibleYears(){
  const thisYear=+todayISO().slice(0,4), map={};
  const add=(y,kind)=>{ if(!map[y])map[y]={tahun:y,tasks:0,meetings:0,events:0}; map[y][kind]++; };
  tasks().forEach(t=>{ if(!t.tanggal)return; const y=+String(t.tanggal).slice(0,4); if(y<thisYear)add(y,"tasks"); });
  meetings().forEach(m=>{ if(!m.tanggal)return; const y=+String(m.tanggal).slice(0,4); if(y<thisYear)add(y,"meetings"); });
  events().forEach(e=>{ if(!e.tanggal)return; const y=+String(e.tanggal).slice(0,4); if(y<thisYear)add(y,"events"); });
  return Object.values(map).sort((a,b)=>a.tahun-b.tahun);
}

/* ============================ TEMPLATE RUTIN ============================
   Tersimpan di META.rutin (ikut dokumen meta/pengaturan, jadi ikut sinkron & tidak menambah koleksi).
   Task dibuat otomatis SEKALI per hari yang cocok. Id task deterministik ("r-<templat>-<tanggal>")
   supaya dua perangkat yang sama-sama membuka aplikasi tidak menghasilkan duplikat, dan
   r.terakhir mencegah task yang sengaja dihapus dibuat ulang di hari yang sama. */
const HARI_EN_FULL=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const namaHari=i=>LANG==="en"?HARI_EN_FULL[i]:HARI[i];
function polaLabel(r){
  if(r.pola==="kerja")return L("rutin.polaKerja");
  if(r.pola==="mingguan")return L("rutin.lblMingguan").replace("{h}",namaHari(+r.hari));
  return L("rutin.lblBulanan").replace("{n}",r.tgl);
}
function rutinCocok(r,dt){
  const d=fromISO(dt), w=d.getDay();
  if(r.pola==="kerja")return w>=1&&w<=5;
  if(r.pola==="mingguan")return w===+r.hari;
  if(r.pola==="bulanan"){ const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(); return d.getDate()===Math.min(+r.tgl||1,last); }
  return false;
}
let rutinTgl="";
async function buatRutinHariIni(){
  const hi=todayISO();
  if(!canWrite||!booted||rutinTgl===hi)return;
  rutinTgl=hi;
  const out=[]; let n=0, ubah=false;
  for(const r of (META.rutin||[])){
    if(r.aktif!==false&&r.terakhir!==hi&&rutinCocok(r,hi)){
      const id="r-"+r.id+"-"+hi;
      if(!D.tasks.has(id)){
        await put("tasks",{id,judul:r.judul,deskripsi:"",tanggal:hi,jam_mulai:r.jam_mulai||"",jam_selesai:"",status:"Belum Dimulai",prioritas:r.prioritas||"Sedang",
          kategori:r.kategori||"",unit_terkait:r.unit_terkait||"",project_id:r.project_id||"",indikator_id:r.indikator_id||"",output:r.output||"",catatan:"",
          sumber:"Rutin",deadline:"",bukti:[],rutin_id:r.id,dibuat_pada:new Date().toISOString()});
        n++;
      }
      out.push(Object.assign({},r,{terakhir:hi})); ubah=true;
    } else out.push(r);
  }
  if(ubah){ META.rutin=out; await putMeta(); }
  if(n)toast(L("toast.rutinMade").replace("{n}",n));
}

async function dorongKeServer(){
  if(!db){ toast(L("sync.noDb")); return; }
  const total=COLLS.reduce((s,c)=>s+D[c].size,0);
  if(!total){ toast(L("sync.nothing")); return; }
  if(!(await askConfirm(L("sync.confirmPush")+total+L("sync.confirmPushSuffix"))))return;
  let ok=0,gagal=0;
  for(const c of COLLS){
    for(const o of [...D[c].values()]){
      try{ await db.doc(c+"/"+o.id).set(o); ok++; }catch(e){ gagal++; }
    }
  }
  for(const k of Object.keys(ARSIP)){ try{ await db.doc("arsip/"+k).set(ARSIP[k]); }catch(e){} }
  try{ await db.doc("meta/pengaturan").set(META); }catch(e){}
  try{ await db.doc("meta/ekp").set(EKPMETA); }catch(e){}
  toast(L("sync.pushDonePrefix")+ok+(gagal?L("sync.pushFailMid")+gagal:"")+L("sync.pushDoneSuffix"));
}
async function tarikDariServer(){

function pulihkanCadangan(){

  inp.onchange=async()=>{

    const jml=COLLS.reduce((s,c)=>s+((dump&&dump[c]||[]).length),0);

    if(!(await askConfirm(L("sync.confirmRestore")+jml+L("sync.confirmRestoreSuffix"))))return;

      }
      lsSet(c);
    }
    render();

  };

}

async function arsipkanTahun(tahun){
  const th=+tahun;
  const tks=tasks().filter(t=>t.tanggal&&+String(t.tanggal).slice(0,4)===th);
  const mts=meetings().filter(m=>m.tanggal&&+String(m.tanggal).slice(0,4)===th);
  const evs=events().filter(e=>e.tanggal&&+String(e.tanggal).slice(0,4)===th);
  if(!tks.length&&!mts.length&&!evs.length){toast(L("set.archiveNone"));return;}
  const ok=await askConfirm(L("set.confirmPrefix")+tks.length+L("set.confirmMid1")+mts.length+L("set.confirmMid2")+evs.length+L("set.confirmMid3")+th+L("set.confirmSuffix"));
  if(!ok)return;
  const byMonth={};
  const push=(k,rec)=>{ const b=String(rec.tanggal).slice(5,7); const key=th+"-"+b; if(!byMonth[key])byMonth[key]={tahun:th,bulan:b,tasks:[],meetings:[],events:[]}; byMonth[key][k].push(rec); };
  tks.forEach(t=>push("tasks",t)); mts.forEach(m=>push("meetings",m)); evs.forEach(e=>push("events",e));
  for(const key of Object.keys(byMonth)) await putArsip(key,byMonth[key]);
  tks.forEach(t=>{D.tasks.delete(t.id); if(db)db.doc("tasks/"+t.id).delete().catch(()=>{});});
  mts.forEach(m=>{D.meetings.delete(m.id); if(db)db.doc("meetings/"+m.id).delete().catch(()=>{});});
  evs.forEach(e=>{D.events.delete(e.id); if(db)db.doc("events/"+e.id).delete().catch(()=>{});});
  lsSet("tasks");lsSet("meetings");lsSet("events");
  render();
  toast(L("set.archivedPrefix")+th+L("set.archivedSuffix"));
}

/* Satu-satunya jalur unduhan yang diizinkan frame artifact: downloads.save().
   Ekstensi di luar daftar ini ditolak server dengan rejected_extension. */
const EKSTENSI_BOLEH=["png","jpg","jpeg","webp","gif","mp4","webm","txt","json","md","csv","ttf","html","svg","pdf","xlsx","zip","docx","pptx","epub"];
async function simpanBerkas(nama,data){
  const ext=String(nama).split(".").pop().toLowerCase();
  if(EKSTENSI_BOLEH.indexOf(ext)<0){ toast(L("dl.errExt")+ext+")"); return false; }
  if(!dlFn){ toast(L("dl.noCap")); return false; }
  try{ await dlFn.save({filename:nama,data:data}); return true; }
  catch(e){
    const c=(e&&e.code)||"unavailable";
    if(c==="declined")return true;
    const pesan={rejected_extension:L("dl.errExt")+ext+")",too_large:L("dl.errBig"),rate_limited:L("dl.errRate"),
      bad_request:L("dl.errBad"),not_granted:L("dl.noCap"),unavailable:L("dl.noCap")}[c]||L("dl.errGeneric")+c+")";
    toast(pesan); return false;
  }
}

const XLSX_LEBAR=[4.84,25.15,8.84,14.15,16.84,25.15,4.84,24.54,15.69,25.54,41.15];
function ekpGayaXlsx(st){
  const b={style:"thin",color:{rgb:"FF000000"}};
  const dasar={font:{name:"Times New Roman",sz:11},alignment:{vertical:"center",wrapText:true},border:{top:b,bottom:b,left:b,right:b}};
  if(st==="judul")return {font:{name:"Times New Roman",sz:12,bold:true},alignment:{horizontal:"center",vertical:"center",wrapText:true}};
  if(st==="polos")return {font:{name:"Times New Roman",sz:11},alignment:{vertical:"center",wrapText:true}};
  if(st==="head")return Object.assign({},dasar,{font:{name:"Times New Roman",sz:11,bold:true},alignment:{horizontal:"center",vertical:"center",wrapText:true},fill:{fgColor:{rgb:"FFD9E2F3"}}});
  if(st==="tebal")return Object.assign({},dasar,{font:{name:"Times New Roman",sz:11,bold:true}});
  if(st==="tengah")return Object.assign({},dasar,{alignment:{horizontal:"center",vertical:"center",wrapText:true}});
  return dasar;
}
async function unduhEkpXlsx(){
  const btn=$("#ekp-xlsx"); if(btn){btn.disabled=true;btn.textContent=L("ekp.xlsxBusy");}
  const g=ekpGrid();
  const nama="EKP_"+g.per.replace("-","_")+"_"+slug(EKPMETA.pegawai.nama||"pegawai").replace(/-/g,"_");
  try{
    const X=await muatXlsxLib();
    if(!X)throw new Error("lib");
    const ws={};
    g.rows.forEach((cells,ri)=>cells.forEach((cell,ci)=>{
      if(!cell)return;
      ws[X.utils.encode_cell({r:ri,c:ci})]={t:"s",v:cell.v,s:ekpGayaXlsx(cell.st)};
    }));
    ws["!ref"]=X.utils.encode_range({s:{r:0,c:0},e:{r:g.rows.length-1,c:10}});
    ws["!merges"]=g.merges;
    ws["!cols"]=XLSX_LEBAR.map(w=>({wch:w}));
    ws["!rows"]=g.rows.map((_,i)=>g.tinggi[i]?{hpt:g.tinggi[i]}:{});
    const wb=X.utils.book_new();
    X.utils.book_append_sheet(wb,ws,"Evaluasi Kinerja Kuanti JAJF");
    const buf=X.write(wb,{bookType:"xlsx",type:"array",cellStyles:true});
    await simpanBerkas(nama+".xlsx",new Blob([buf]));
  }catch(e){
    toast(L("ekp.xlsxGagal"));
  }
  if(btn){btn.disabled=false;btn.textContent=L("ekp.btnDownloadXlsx");}
}

function calSel(d){
  return {ev:eventsOn(d),ts:tasksOn(d),dl:tasks().filter(t=>t.deadline===d&&t.tanggal!==d)};
}
function dayDots(d){
  const S=calSel(d), out=[];
  if(S.ev.length)out.push('<span class="dot meet" title="'+esc(S.ev.map(e=>e.judul).join("\n"))+'">'+S.ev.length+'<i class="sfx">'+esc(L("cal.agendaShort"))+'</i></span>');

function calJudul(d,max){
  const S=calSel(d), all=[];
  S.ev.forEach(e=>all.push({c:e.jenis==="Rapat"?"meet":"",j:e.judul}));
  S.ts.forEach(t=>all.push({c:"task",j:t.judul}));
  S.dl.forEach(t=>all.push({c:"dl",j:t.judul}));
  const out=all.slice(0,max).map(x=>'<span class="dot '+x.c+'" title="'+esc(x.j)+'"'+(x.c==="task"?' style="background:none;border:1px solid var(--line);color:var(--ink-2)"':"")+'>'+esc(x.j)+'</span>');
  const sisa=all.length-max; if(sisa>0)out.push('<span class="dot more">+'+sisa+esc(L("cal.moreSuffix"))+'</span>');
  return out.join("");
}
function calBulan(cur){
  const d0=fromISO(cur), y=d0.getFullYear(), m=d0.getMonth();
  const first=new Date(y,m,1), start=new Date(y,m,1-first.getDay());
  let cells="";
  for(let i=0;i<42;i++){
    const d=new Date(start); d.setDate(start.getDate()+i); const s=iso(d);
    cells+='<button class="cday'+(d.getMonth()!==m?" out":"")+(s===todayISO()?" today":"")+'" data-act="pick-date" data-v="'+s+'" aria-pressed="'+(s===UI.date)+'">'+
      '<span class="dn">'+d.getDate()+'</span>'+dayDots(s)+'</button>';

  return calNav(bulanArr()[m]+" "+y)+'<div class="cal m">'+dowShort().map(x=>'<div class="dow">'+x+'</div>').join("")+cells+'</div>';
}
function calMinggu(cur){
  const d0=fromISO(cur), start=addDays(cur,-d0.getDay());

      '<span class="dn">'+d.getDate()+'</span>'+calJudul(s,5)+'</button>';}
  return calNav(L("cal.segWeek")+" "+fmtTgl(start,"mid")+" – "+fmtTgl(addDays(start,6),"mid"))+
    '<div class="cal w">'+dowShort().map(x=>'<div class="dow">'+x+'</div>').join("")+cells+'</div>';
}

function agg(list,keyfn){
  const m=new Map();
  list.forEach(t=>{const k=keyfn(t);const c=m.get(k)||{menit:0,n:0};c.menit+=durasi(t);c.n++;m.set(k,c);});
  return [...m.entries()].sort((a,b)=>b[1].menit-a[1].menit||b[1].n-a[1].n);
}
function hbars(rows,total){
  if(!rows.length)return '<div class="empty">'+esc(L("daily.emptyData"))+'</div>';
  const max=Math.max(1,...rows.map(r=>r[1].menit||r[1].n));
  return rows.map(r=>{const v=r[1].menit||0;
    return '<div class="hbar"><div class="lb" title="'+esc(r[0])+'">'+esc(r[0])+'</div>'+
      '<div class="bar"><i style="width:'+clamp(Math.round((v||r[1].n)/max*100),3,100)+'%"></i></div>'+
      '<div class="vl">'+(v?fmtDur(v):r[1].n+esc(L("daily.itemUnit")))+'</div></div>';}).join("");
}
function timeline(dt){

  ts.forEach(t=>items.push({m:toMin(t.jam_mulai),tipe:"task",o:t}));
  ev.forEach(e=>items.push({m:toMin(e.jam_mulai),tipe:"event",o:e}));
  const berjam=items.filter(x=>x.m!=null).sort((a,b)=>a.m-b.m);
  const tanpa=items.filter(x=>x.m==null);
  if(!items.length)return '<div class="empty">'+esc(L("daily.emptyActivity"))+'</div>';
  let h='<div class="tl">';
  berjam.forEach(x=>{
    if(x.tipe==="task"){const t=x.o,d=durasi(t);
      const k=t.status==="Selesai"?"done":t.status==="Ditunda"?"hold":t.status==="Dibatalkan"?"cancel":"";
      h+='<div class="tlrow"><span class="hh">'+esc(t.jam_mulai)+'</span><div class="tlblock '+k+'" data-act="open-task" data-id="'+t.id+'" style="cursor:pointer">'+

        (t.output?'<div class="tiny" style="margin-top:5px"><b>'+esc(L("daily.outputLabel"))+'</b> '+esc(t.output)+'</div>':"")+'</div></div>';
    } else {const e=x.o;

        (e.lokasi?'<span class="chip">'+esc(e.lokasi)+'</span>':"")+'</div></div></div>';}
  });

function vAnalytics(){
  const dt=todayISO(), from=addDays(dt,-29);
  const hari=[]; for(let i=29;i>=0;i--)hari.push(addDays(dt,-i));
  const selesaiPerHari=hari.map(d=>tasks().filter(t=>t.status==="Selesai"&&t.tanggal===d).length);
  const range=tasks().filter(t=>t.tanggal>=from&&t.tanggal<=dt);
  const selesai=range.filter(t=>t.status==="Selesai").length;
  const rate=range.length?Math.round(selesai/range.length*100):0;
  const menit=range.reduce((s,t)=>s+durasi(t),0);
  const kat=agg(range,t=>t.kategori?LV("kategori",t.kategori):L("daily.noCategory"));
  const per=curPeriode(), rg=periodeRange(per);
  const skpRows=indikators().map(i=>({i,r:hitungRealisasi(i,rg.from,rg.to)}));
  const belum=tasks().filter(t=>t.status!=="Selesai"&&t.status!=="Dibatalkan");
  const umur=LANG==="en"?[["0–2 days",0],["3–7 days",0],["8–14 days",0],["15–30 days",0],["> 30 days",0]]:[["0–2 hari",0],["3–7 hari",0],["8–14 hari",0],["15–30 hari",0],["> 30 hari",0]];
  belum.forEach(t=>{const u=diffDays(t.tanggal,dt);const k=u<=2?0:u<=7?1:u<=14?2:u<=30?3:4;if(u>=0)umur[k][1]++;});
  const projRows=projects().filter(p=>p.status!=="Cancelled").map(p=>({p,pr:progressProject(p)})).filter(x=>x.pr.total>0);

  return '<div class="page-h"><div><h1>'+esc(L("ana.title"))+'</h1><div class="sub">'+L("ana.subtitlePrefix")+esc(fmtTgl(from,"mid"))+' – '+esc(fmtTgl(dt,"mid"))+L("ana.subtitleMid")+esc(rg.label)+'</div></div></div>'+
  '<div class="grid g4" style="margin-bottom:14px">'+
    tile(L("ana.tileCompletion"),rate+"%",selesai+esc(L("ana.tileCompletionMid"))+range.length+esc(L("ana.tileCompletionSuffix")),"accent")+
    tile(L("ana.tileAvgDay"),(range.length/30).toFixed(1),L("ana.tileAvgDaySuffix"))+
    tile(L("ana.tileHoursLogged"),fmtDur(menit),L("ana.tileHoursLoggedSuffix"),"brass")+
    tile(L("ana.tileUnfinished"),belum.length,belum.filter(t=>t.tanggal<dt).length+esc(L("ana.tileUnfinishedSuffix")))+
  '</div>'+
  '<div class="card" style="margin-bottom:12px"><h2 class="sec">'+esc(L("ana.secTrend"))+' <span class="cnt">'+esc(L("ana.secTrendCaption"))+'</span></h2>'+
    chartTren(hari,selesaiPerHari)+'</div>'+
  '<div class="grid g2" style="margin-bottom:12px">'+cardSumber(range)+cardTenggat(from,dt)+'</div>'+
  cardHeat()+
  '<div class="grid g2" style="margin-bottom:12px">'+
    '<div class="card"><h2 class="sec">'+esc(L("ana.secTimeByCategory"))+'</h2>'+hbars(kat,menit)+
      '<div class="tiny muted" style="margin-top:8px">'+esc(L("ana.hintTimeByCategory"))+'</div></div>'+
    '<div class="card"><h2 class="sec">'+esc(L("ana.secAgeUnfinished"))+'</h2>'+chartUmur(umur)+
      '<div class="tiny muted" style="margin-top:8px">'+esc(L("ana.hintAgeUnfinished"))+'</div></div>'+
  '</div>'+
  '<div class="card" style="margin-bottom:12px"><h2 class="sec">'+esc(L("ana.secSkpProgress"))+' <span class="cnt">'+esc(rg.label)+'</span></h2>'+
    skpRows.map(x=>{const s=statusCapaian(x.i,x.r);
      return '<div class="hbar"><div class="lb" title="'+esc(x.i.indikator)+'">'+(x.i.jenis==="tambahan"?pfxT():"")+x.i.no+'. '+esc(x.i.indikator)+'</div>'+
        '<div class="bar"><i class="'+s.k.replace("acc","")+'" style="width:'+persenCapaian(x.i,x.r)+'%"></i></div>'+
        '<div class="vl">'+esc(x.i.target_satuan==="Indeks"?tampilRealisasi(x.i,x.r):(nilaiUtama(x.i,x.r)+"/"+x.i.target_nilai))+'</div></div>';}).join("")+
  '</div>'+
  '<div class="card"><h2 class="sec">'+esc(L("ana.secBurnup"))+' <span class="cnt">'+esc(L("ana.secBurnupCaption"))+'</span></h2>'+
    (projRows.length?projRows.map(x=>'<div class="hbar"><div class="lb">'+esc(x.p.nama)+'</div><div class="bar"><i class="'+(x.pr.pct>=100?"ok":"")+'" style="width:'+x.pr.pct+'%"></i></div><div class="vl">'+x.pr.selesai+"/"+x.pr.total+'</div></div>').join("")

function tglSelesai(t){ return t.selesai_pada?tglLokal(t.selesai_pada):(t.tanggal||""); }
const SUMBER_LUAR=["Disposisi Pimpinan","Hasil Rapat","Permintaan Unit Lain"];
function cardSumber(range){
  const m=new Map(); range.forEach(t=>{const k=t.sumber||"";m.set(k,(m.get(k)||0)+1);});
  const rows=[...m.entries()].sort((a,b)=>b[1]-a[1]), total=range.length, max=Math.max(1,...rows.map(r=>r[1]));
  const berisi=range.filter(t=>t.sumber), luar=berisi.filter(t=>SUMBER_LUAR.includes(t.sumber)).length;
  return '<div class="card"><h2 class="sec">'+esc(L("ana.secSource"))+'</h2>'+
    (rows.length?rows.map(([k,n])=>'<div class="hbar"><div class="lb">'+esc(k?LV("sumber",k):L("ana.srcUnset"))+'</div>'+
      '<div class="bar"><i class="'+(SUMBER_LUAR.includes(k)?"warn":"")+'" style="width:'+clamp(Math.round(n/max*100),4,100)+'%"></i></div>'+
      '<div class="vl">'+n+' · '+Math.round(n/total*100)+'%</div></div>').join(""):'<div class="empty">'+esc(L("daily.emptyData"))+'</div>')+
    (berisi.length?'<div class="tiny muted" style="margin-top:8px">'+esc(L("ana.srcHint").replace("{p}",Math.round(luar/berisi.length*100)))+'</div>':"")+
  '</div>';
}
function cardTenggat(from,dt){
  const ts=tasks().filter(t=>t.deadline&&t.deadline>=from&&t.deadline<=dt&&t.status!=="Dibatalkan");
  let on=0,late=0,open=0,telat=0;
  ts.forEach(t=>{
    if(t.status==="Selesai"){ const d=tglSelesai(t); if(d<=t.deadline)on++; else{late++;telat+=diffDays(t.deadline,d);} }
    else if(t.deadline<dt)open++;
  });
  const tot=on+late+open;
  if(!tot)return '<div class="card"><h2 class="sec">'+esc(L("ana.secOnTime"))+'</h2><div class="empty">'+esc(L("ana.otEmpty"))+'</div></div>';
  const seg=(n,c)=>n?'<i style="width:'+(n/tot*100).toFixed(1)+'%;background:var('+c+')"></i>':"";
  const leg=(n,c,lb,ex)=>'<div class="legrow"><span class="sw" style="background:var('+c+')"></span><span>'+esc(lb)+(ex?' <span class="muted tiny">· '+esc(ex)+'</span>':"")+'</span><span class="vl">'+n+'</span></div>';
  return '<div class="card"><h2 class="sec">'+esc(L("ana.secOnTime"))+'</h2>'+
    '<div style="display:flex;align-items:baseline;gap:8px;margin-bottom:8px"><span class="num" style="font-size:26px;font-weight:600;color:var(--accent)">'+Math.round(on/tot*100)+'%</span><span class="tiny muted">'+on+esc(L("common.of"))+tot+'</span></div>'+
    '<div class="stackbar">'+seg(on,"--ok")+seg(late,"--warn")+seg(open,"--crit")+'</div>'+
    '<div style="margin-top:8px">'+leg(on,"--ok",L("ana.otOn"))+leg(late,"--warn",L("ana.otLate"),late?L("ana.otAvgLate").replace("{d}",(telat/late).toFixed(1)):"")+leg(open,"--crit",L("ana.otOpen"))+'</div>'+
    '<div class="tiny muted" style="margin-top:6px">'+esc(L("ana.otHint"))+'</div></div>';
}
const HEAT=["var(--surface-2)","color-mix(in srgb,var(--accent) 30%,var(--surface-2))","color-mix(in srgb,var(--accent) 55%,var(--surface-2))","color-mix(in srgb,var(--accent) 80%,var(--surface-2))","var(--accent)"];
function cardHeat(){
  const dt=todayISO(), dow=(fromISO(dt).getDay()+6)%7, start=addDays(dt,-dow-77);
  const cnt=new Map(); tasks().forEach(t=>{ if(t.status==="Selesai"){const k=tglSelesai(t);cnt.set(k,(cnt.get(k)||0)+1);} });
  const CS=32,G=4,PL=34,PT=22,W=PL+12*(CS+G),H=PT+7*(CS+G);
  const nm=dowShort(), rowNm=[nm[1],nm[2],nm[3],nm[4],nm[5],nm[6],nm[0]], bln=bulanArr();
  let cells="",xl="",yl="",tot=0,aktif=0,hari=0;
  for(let w=0;w<12;w++){
    const ws=addDays(start,w*7), mo=fromISO(ws).getMonth();
    if(w===0||fromISO(addDays(ws,-7)).getMonth()!==mo)xl+='<text x="'+(PL+w*(CS+G))+'" y="12">'+esc(String(bln[mo]).slice(0,3))+'</text>';
    for(let r=0;r<7;r++){
      const d=addDays(ws,r); if(d>dt)continue;
      const n=cnt.get(d)||0; hari++; tot+=n; if(n)aktif++;
      const lv=n===0?0:n===1?1:n<=3?2:n<=5?3:4;
      cells+='<rect x="'+(PL+w*(CS+G))+'" y="'+(PT+r*(CS+G))+'" width="'+CS+'" height="'+CS+'" rx="6" style="fill:'+HEAT[lv]+'"'+(lv===0?' stroke="var(--line)"':"")+'><title>'+esc(fmtTgl(d,"mid")+" · "+n+L("ana.heatUnit"))+'</title></rect>';
    }
  }
  [0,2,4].forEach(r=>{yl+='<text x="'+(PL-7)+'" y="'+(PT+r*(CS+G)+CS/2+3)+'" text-anchor="end">'+esc(rowNm[r])+'</text>';});
  const leg=HEAT.map(c=>'<span style="display:inline-block;width:12px;height:12px;border-radius:3px;margin:0 1px;vertical-align:-2px;background:'+c+';border:1px solid var(--line)"></span>').join("");
  return '<div class="card" style="margin-bottom:12px"><h2 class="sec">'+esc(L("ana.secHeat"))+' <span class="cnt">'+esc(L("ana.heatCaption"))+'</span></h2>'+
    '<div style="display:flex;gap:22px;flex-wrap:wrap;align-items:center">'+
      '<div class="chartbox" style="flex:1 1 420px;max-width:600px"><svg class="heat" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(L("ana.secHeat"))+'">'+xl+yl+cells+'</svg></div>'+
      '<div style="flex:1 1 200px"><div class="num" style="font-size:26px;font-weight:600;color:var(--accent)">'+tot+'</div>'+
        '<div class="tiny muted">'+esc(L("ana.heatSummary").replace("{a}",aktif).replace("{d}",hari))+'</div>'+
        '<div class="tiny muted" style="margin-top:12px">'+esc(L("ana.heatLess"))+' '+leg+' '+esc(L("ana.heatMore"))+'</div></div>'+
    '</div></div>';
}
function chartTren(hari,vals){
  const W=760,H=190,PL=30,PR=10,PT=12,PB=26;
  const iw=W-PL-PR, ih=H-PT-PB, n=vals.length;
  const max=Math.max(3,...vals);
  const bw=Math.max(4,iw/n-3);
  let bars="",xl="";
  vals.forEach((v,i)=>{
    const x=PL+i*(iw/n)+1.5, h=v/max*ih;
    bars+='<rect x="'+x.toFixed(1)+'" y="'+(PT+ih-h).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(h,v?1.5:0).toFixed(1)+'" rx="2" fill="var(--accent)" opacity="'+(v?0.75:0)+'"></rect>';
    if(i%5===0||i===n-1)xl+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">'+fromISO(hari[i]).getDate()+'/'+(fromISO(hari[i]).getMonth()+1)+'</text>';
  });
  const ma=vals.map((_,i)=>{const s=Math.max(0,i-6);const a=vals.slice(s,i+1);return a.reduce((x,y)=>x+y,0)/a.length;});
  const pts=ma.map((v,i)=>((PL+i*(iw/n)+1.5+bw/2).toFixed(1))+","+((PT+ih-v/max*ih).toFixed(1))).join(" ");
  let grid="";
  for(let g=0;g<=2;g++){const y=PT+ih-(g/2)*ih;grid+='<line x1="'+PL+'" x2="'+(W-PR)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="var(--line)" stroke-width="1"></line><text x="'+(PL-6)+'" y="'+(y+3).toFixed(1)+'" text-anchor="end">'+Math.round(g/2*max)+'</text>';}
  return '<div class="chartbox"><svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(L("ana.chartAriaLabel"))+'">'+
    grid+bars+'<polyline points="'+pts+'" fill="none" stroke="var(--brass)" stroke-width="2" stroke-linejoin="round"></polyline>'+xl+'</svg></div>';
}
function chartUmur(rows){
  const max=Math.max(1,...rows.map(r=>r[1]));
  const warna=["var(--ok)","var(--accent)","var(--warn)","var(--crit)","var(--crit)"];
  return rows.map((r,i)=>'<div class="hbar"><div class="lb">'+esc(r[0])+'</div><div class="bar"><i style="width:'+clamp(Math.round(r[1]/max*100),r[1]?4:0,100)+'%;background:'+warna[i]+'"></i></div><div class="vl">'+r[1]+'</div></div>').join("");
}

/* ============================ overlay ============================ */
function closeOverlay(){ $("#scrim").hidden=true; $("#drawer").hidden=true; $("#modal").hidden=true; $("#drawer").innerHTML=""; $("#modal").innerHTML=""; }
/* confirm() bawaan browser diblokir di iframe artifact (sandbox tanpa allow-modals) — pakai lapisan sendiri
   di atas drawer/modal supaya form yang sedang dibuka tidak ikut tertutup. */
function askConfirm(msg){
  return new Promise(resolve=>{
    const box=document.createElement("div");
    box.id="confirmlayer";
    box.innerHTML='<div class="cfm-scrim"></div><div class="cfm-box">'+
      '<div class="dhead"><h3>'+esc(L("common.confirmTitle"))+'</h3></div>'+
      '<div class="dbody"><div style="white-space:pre-wrap;line-height:1.6">'+esc(msg)+'</div></div>'+
      '<div class="dfoot"><button class="btn" data-cfm="0">'+esc(L("common.cancel"))+'</button>'+
      '<button class="btn pri" data-cfm="1">'+esc(L("common.ok"))+'</button></div></div>';
    document.body.appendChild(box);
    const done=v=>{ box.remove(); resolve(v); };
    box.addEventListener("click",ev=>{
      const b=ev.target.closest("[data-cfm]");
      if(b){ ev.stopPropagation(); done(b.getAttribute("data-cfm")==="1"); return; }
      if(ev.target.classList.contains("cfm-scrim"))done(false);
    });
    const y=box.querySelector('[data-cfm="1"]'); if(y)y.focus();
  });
}
/* Animasi hanya saat panel BARU dibuka. Beberapa alur (mis. Kesimpulan Kegiatan) memanggil
   openModal dua kali berturut-turut untuk memperbarui isinya — kalau dianimasikan tiap kali,
   panelnya akan tersentak dua kali. */
function openDrawer(html){ const d=$("#drawer"); const baru=d.hidden; const sc=$("#scrim"); const scBaru=sc.hidden;
  sc.hidden=false; $("#modal").hidden=true; d.innerHTML=html; d.hidden=false;
  if(scBaru)animUlang(sc); if(baru)animUlang(d);
  const f=d.querySelector("input,textarea,select"); if(f)f.focus(); }
function openModal(html){ const m=$("#modal"); const baru=m.hidden; const sc=$("#scrim"); const scBaru=sc.hidden;
  sc.hidden=false; $("#drawer").hidden=true; m.innerHTML=html; m.hidden=false;
  if(scBaru)animUlang(sc); if(baru)animUlang(m); }
function fld(label,inner){return '<div class="field"><label>'+esc(label)+'</label>'+inner+'</div>';}
function inp(name,val,attrs){return '<input class="inp" data-k="'+name+'" value="'+esc(val==null?"":val)+'" '+(attrs||"")+'>';}
function txt(name,val,rows){return '<textarea class="inp" data-k="'+name+'" rows="'+(rows||3)+'">'+esc(val==null?"":val)+'</textarea>';}
function sel(name,list,val,blank){return '<select class="inp" data-k="'+name+'">'+selOpts(list,val,blank)+'</select>';}
function readForm(root){
  const o={};
  root.querySelectorAll("[data-k]").forEach(el=>{ o[el.getAttribute("data-k")]= el.type==="checkbox"?el.checked:el.value; });
  return o;
}
