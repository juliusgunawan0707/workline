/* ============================ QUICK ADD ============================ */
function parseQuick(text){
  const o={judul:"",tanggal:todayISO(),jam_mulai:"",jam_selesai:"",prioritas:"Sedang",kategori:"",project_id:"",indikator_id:"",status:"Belum Dimulai",sumber:"Mandiri",bukti:[]};
  let s=" "+String(text||"").trim()+" ";
  const rng=s.match(/\s(\d{1,2})[.:](\d{2})\s*[-–—]\s*(\d{1,2})[.:](\d{2})\s/);
  if(rng){o.jam_mulai=p2(+rng[1])+":"+rng[2];o.jam_selesai=p2(+rng[3])+":"+rng[4];s=s.replace(rng[0]," ");}
  else{const one=s.match(/\s(\d{1,2})[.:](\d{2})\s/);if(one){o.jam_mulai=p2(+one[1])+":"+one[2];s=s.replace(one[0]," ");}}
  const kata=s.match(/\s(hari ini|besok|kemarin|lusa)\s/i);
  if(kata){const k=kata[1].toLowerCase();o.tanggal=addDays(todayISO(),k==="besok"?1:k==="kemarin"?-1:k==="lusa"?2:0);s=s.replace(kata[0]," ");}
  const isoM=s.match(/\s(\d{4}-\d{2}-\d{2})\s/);
  if(isoM){o.tanggal=isoM[1];s=s.replace(isoM[0]," ");}
  else{const dm=s.match(/\s(\d{1,2})\/(\d{1,2})(?:\/(\d{4}))?\s/);
    if(dm){const y=dm[3]?+dm[3]:+todayISO().slice(0,4);o.tanggal=y+"-"+p2(+dm[2])+"-"+p2(+dm[1]);s=s.replace(dm[0]," ");}}
  const pm=s.match(/\s#([^\s#@!\/]+)/);
  if(pm){const key=norm(pm[1].replace(/-/g," "));const hit=projects().find(p=>slug(p.nama).indexOf(slug(pm[1]))===0)||projects().find(p=>norm(p.nama).includes(key));if(hit)o.project_id=hit.id;s=s.replace(pm[0]," ");}
  const am=s.match(/\s@([^\s#@!\/]+)/);
  if(am){const raw=am[1].replace(/^(skp|i)/i,"");const list=indikators();
    let hit=list.find(i=>i.id===am[1])||list.find(i=>String(i.no)===raw&&i.jenis==="utama")||list.find(i=>norm(i.indikator).includes(norm(am[1].replace(/-/g," "))));
    if(hit)o.indikator_id=hit.id;s=s.replace(am[0]," ");}
  const im=s.match(/\s!(mendesak|tinggi|sedang|rendah)\b/i);
  if(im){o.prioritas=im[1][0].toUpperCase()+im[1].slice(1).toLowerCase();s=s.replace(im[0]," ");}
  const km=s.match(/\s\/([^\s#@!\/]+)/);
  if(km){const hit=META.kategori.find(k=>slug(k).indexOf(slug(km[1]))===0)||META.kategori.find(k=>norm(k).includes(norm(km[1])));if(hit)o.kategori=hit;s=s.replace(km[0]," ");}
  o.judul=s.trim().replace(/\s+/g," ");
  if(!o.kategori&&o.indikator_id){const i=indById(o.indikator_id);if(i&&i.kategori_saran)o.kategori=i.kategori_saran;}
  if(!o.kategori&&/rapat|koordinasi|audiensi/i.test(o.judul))o.kategori="Rapat & Koordinasi";
  if(o.jam_mulai&&o.jam_selesai)o.status="Selesai";
  return o;
}
function quickHint(text){
  if(!$("#qahint"))return;
  if(!text.trim()){$("#qahint").hidden=true;return;}
  const o=parseQuick(text);
  const bits=[];
  bits.push('<span class="chip">'+esc(fmtTgl(o.tanggal,"mid"))+'</span>');
  if(o.jam_mulai)bits.push('<span class="chip acc">'+esc(o.jam_mulai+(o.jam_selesai?"–"+o.jam_selesai:""))+'</span>');
  if(o.project_id)bits.push('<span class="chip acc">'+esc(labelProject(o.project_id))+'</span>');
  if(o.indikator_id)bits.push('<span class="chip bra">'+esc(labelInd(o.indikator_id).slice(0,40))+'</span>');
  if(o.kategori)bits.push('<span class="chip">'+esc(LV("kategori",o.kategori))+'</span>');
  if(o.prioritas!=="Sedang")bits.push('<span class="chip warn">'+esc(LV("prioritas",o.prioritas))+'</span>');
  bits.push('<span class="chip '+(o.status==="Selesai"?"ok":"")+'">'+esc(LV("status",o.status))+'</span>');
  const el=$("#qahint");
  el.innerHTML='<div class="t">'+esc(o.judul||L("qa.emptyTitleFallback"))+'</div><div style="display:flex;gap:5px;flex-wrap:wrap">'+bits.join("")+'</div>'+
    '<div class="tiny muted" style="margin-top:6px">'+L("qa.hintLegend")+'</div>';
  el.hidden=false;
}

/* ============================ GENERATOR ============================ */
const VERBA=[["penyusunan","Menyusun"],["penyusuanan","Menyusun"],["susun","Menyusun"],["telaah","Menelaah"],["penelaahan","Menelaah"],
 ["reviu","Mereviu"],["review","Mereviu"],["analisis","Menganalisis"],["koordinasi","Melakukan koordinasi"],["monitoring","Melakukan monitoring"],
 ["evaluasi","Melakukan evaluasi"],["verifikasi","Memverifikasi"],["pengecekan","Memeriksa"],["pembahasan","Membahas"],["layanan","Memberikan layanan"],
 ["pengisian","Melakukan pengisian"],["input","Melakukan input"],["rekapitulasi","Merekapitulasi"],["pendampingan","Melakukan pendampingan"],
 ["pengembangan","Mengembangkan"],["perbaikan","Melakukan perbaikan"],["pemantauan","Memantau"],["sosialisasi","Melaksanakan sosialisasi"],
 ["pelatihan","Mengikuti pelatihan"],["bimtek","Mengikuti bimbingan teknis"],["workshop","Mengikuti workshop"]];
function frasaKerja(judul){
  let s=String(judul||"").trim();
  if(!s)return "";
  if(/^(meng|men|mem|me|ber|mel)[a-z]/i.test(s.split(" ")[0])&&/^[A-Z]/.test(s))return s;
  const low=s.toLowerCase();
  if(/^rapat\b/.test(low))return "Mengikuti rapat "+s.replace(/^rapat\s*/i,"");
  for(const [k,v] of VERBA){ if(low.indexOf(k)===0) return v+" "+s.slice(k.length).trim(); }
  if(/^(meng|men|mem|me|ber|mel)[a-z]/i.test(low))return s.charAt(0).toUpperCase()+s.slice(1);
  return "Melaksanakan "+s.charAt(0).toLowerCase()+s.slice(1);
}
function rapi(s){ s=String(s||"").trim().replace(/\s+/g," "); if(!s)return ""; s=s.charAt(0).toUpperCase()+s.slice(1); if(!/[.!?]$/.test(s))s+="."; return s; }
const PRIO_W={Mendesak:4,Tinggi:3,Sedang:2,Rendah:1};
function buatPresensi(dt){
  const IR=itemRekap(dt);
  /* Yang sudah Selesai selalu naik lebih dulu — itu yang layak dilaporkan sebagai pekerjaan hari ini. */
  const items=IR.kandidat.map(t=>({teks:frasaKerja(t.judul),skor:(t.status==="Selesai"?10000:0)+(PRIO_W[t.prioritas]||2)*100+durasi(t)+(t.output?60:0)}))
    .concat(IR.keg);
  items.sort((a,b)=>b.skor-a.skor);
  if(!items.length)return "";
  let baris;
  if(items.length<=5) baris=items.map(x=>x.teks);
  else { baris=items.slice(0,4).map(x=>x.teks); baris.push(items[4].teks+", serta "+(items.length-5)+" kegiatan lainnya"); }
  /* terapkanGaya paling akhir: kamus dikunci pada kalimat sebagaimana ia TAMPIL di kotak
     rekap (sudah lewat rapi(), tanpa nomor urut) — itulah yang pengguna lihat saat merevisi. */
  return baris.map((b,i)=>(i+1)+". "+terapkanGaya(rapi(b))).join("\n");
}
function faktaHari(dt){
  const IR=itemRekap(dt);
  const f={tanggal:fmtTgl(dt,"long"),pekerjaan:[],agenda:[],rapat:[],kegiatan:[],output:[],catatan:[]};
  const KT=IR.kandidat;
  KT.forEach(t=>f.pekerjaan.push({judul:t.judul,status:t.status,jam:(t.jam_mulai||"")+(t.jam_selesai?"-"+t.jam_selesai:""),durasi_menit:durasi(t),
    kategori:t.kategori||"",project:labelProject(t.project_id)||"",skp:t.indikator_id?labelInd(t.indikator_id):"",output:t.output||"",catatan:t.catatan||""}));
  /* Agenda yang dikirim ke AI kini ikut disaring: yang dibatalkan/ditunda tidak jadi bahan. */
  agendaDihitung(dt).forEach(e=>f.agenda.push({judul:e.judul,jenis:e.jenis,jam:(e.jam_mulai||""),lokasi:e.lokasi||""}));
  meetingsOn(dt).forEach(m=>f.rapat.push({judul:m.judul,pokok:(m.pokok||[]).slice(0,6),keputusan:(m.keputusan||[]).slice(0,6),
    tindak_lanjut:(m.tindak_lanjut||[]).map(x=>x.uraian).slice(0,6),kesimpulan:m.kesimpulan||""}));
  /* Kalimat agenda+notulensi yang sudah digabung, persis seperti di Rekap Presensi. */
  IR.keg.forEach(k=>f.kegiatan.push(k.teks));
  KT.forEach(t=>{if(t.output)f.output.push(t.output);if(t.catatan)f.catatan.push(t.catatan);});
  return f;
}
function angkaDari(obj){
  const s=JSON.stringify(obj), set=new Set();
  (s.match(/\d+(?:[.,]\d+)?/g)||[]).forEach(n=>set.add(n.replace(",",".")));
  return set;
}
function lolosValidasi(teks,izin){
  const nums=String(teks).match(/\d+(?:[.,]\d+)?/g)||[];
  return nums.every(n=>izin.has(n.replace(",",".")));
}
async function aiJson(prompt,tier){
  if(!sampleFn)return null;
  try{ return await sampleFn.json(prompt,{modelTier:tier||"default",cache:false}); }
  catch(e){
    const pesan={not_granted:L("ai.errNotGranted"),sampling_disabled:L("ai.errDisabled"),
      rate_limited:L("ai.errRateLimited"),invalid_json:L("ai.errInvalidJson"),
      refused:L("ai.errRefused"),cancelled:""}[e&&e.code];
    if(pesan)toast(pesan); else if(e&&e.code)toast(L("ai.errGenericPrefix")+e.code+L("ai.errGenericSuffix"));
    return null;
  }
}
function kesimpulanDeterministik(f){
  const sel=f.pekerjaan.filter(p=>p.status==="Selesai");
  const keg=f.kegiatan||[];
  /* Aktivitas memakai kalimat gabungan yang sama dengan Rekap Presensi — sebelum v2.1
     seksi ini memungut notulensi sendiri, jadi satu rapat bisa muncul dua kali. */
  const akt=f.pekerjaan.map(p=>rapi(terapkanGaya(frasaKerja(p.judul)))).concat(keg.map(x=>rapi(terapkanGaya(x))));
  const out=f.output.map(rapi);
  const nRapat=f.agenda.filter(a=>a.jenis==="Rapat").length;
  let kes="Data belum tersedia.";
  if(f.pekerjaan.length||f.rapat.length||keg.length){
    const bits=[];
    if(sel.length)bits.push(sel.length+" pekerjaan diselesaikan");
    const jalan=f.pekerjaan.filter(p=>p.status==="Berjalan").length; if(jalan)bits.push(jalan+" pekerjaan masih berjalan");
    if(nRapat)bits.push(nRapat+" rapat dihadiri");
    if(f.rapat.length)bits.push(f.rapat.length+" notulensi disusun");
    if(out.length)bits.push(out.length+" output dihasilkan");
    kes="Pada "+f.tanggal+" tercatat "+bits.join(", ")+".";
  }
  return {aktivitas:akt.length?akt:["Data belum tersedia."],output:out.length?out:["Data belum tersedia."],kesimpulan:kes};
}

  if(!f.pekerjaan.length&&!f.rapat.length&&!f.agenda.length&&!(f.kegiatan||[]).length){
    UI.gen.aktivitas=["Data belum tersedia."];UI.gen.output=["Data belum tersedia."];UI.gen.kesimpulan="Data belum tersedia.";
    return {sumberAI:false};

   '5. Bedakan tegas: AKTIVITAS = apa yang dikerjakan. OUTPUT = benda/dokumen/hasil yang dihasilkan. KESIMPULAN = satu paragraf 2-3 kalimat tentang apa yang secara keseluruhan dilaksanakan hari itu.\n\n'+
   'DATA:\n'+JSON.stringify(f)+'\n\n'+
   'Balas HANYA JSON dengan bentuk: {"aktivitas":["..."],"output":["..."],"kesimpulan":"..."}';
  const r=await aiJson(prompt);

  }
  return {sumberAI:false};
}

/* ============================ PENCARIAN GLOBAL ============================ */
function globalSearch(q){
  const n=norm(q); if(n.length<2)return [];
  const hit=[];
  tasks().forEach(t=>{if((norm(t.judul)+norm(t.deskripsi)+norm(t.output)+norm(t.catatan)).includes(n))hit.push({t:L("search.typeTask"),l:t.judul,s:fmtTgl(t.tanggal,"mid")+" · "+LV("status",t.status),a:"open-task",id:t.id});});
  projects().forEach(p=>{if((norm(p.nama)+norm(p.deskripsi)+norm(p.tujuan)).includes(n))hit.push({t:L("search.typeProject"),l:p.nama,s:LV("pstatus",p.status),a:"open-project",id:p.id});});
  meetings().forEach(m=>{if((norm(m.judul)+norm(m.pembahasan)+norm(m.kesimpulan)+norm((m.keputusan||[]).join(" "))+norm((m.tindak_lanjut||[]).map(x=>x.uraian).join(" "))).includes(n))hit.push({t:L("search.typeMeeting"),l:m.judul,s:fmtTgl(m.tanggal,"mid"),a:"open-meeting",id:m.id});});
  events().forEach(e=>{if(norm(e.judul).includes(n))hit.push({t:L("search.typeEvent"),l:e.judul,s:fmtTgl(e.tanggal,"mid")+" · "+LV("agenda",e.jenis||""),a:"open-event",id:e.id});});
  indikators().forEach(i=>{if((norm(i.indikator)+norm(i.rhk)).includes(n))hit.push({t:L("search.typeSkp"),l:i.indikator,s:i.rhk,a:"go-skp",id:i.id});});
  return hit.slice(0,40);
}
function searchHTML(q){

function parsePipe(s,keys){return parseLines(s).map(l=>{const a=l.split("|").map(x=>x.trim());const o={};keys.forEach((k,i)=>o[k]=a[i]||"");return o;});}

async function tlToTask(mid,idx){

    deadline:tl.deadline||"",status:"Belum Dimulai",prioritas:tl.deadline?"Tinggi":"Sedang",
    kategori:"",unit_terkait:"",project_id:m.project_id||"",indikator_id:m.indikator_id||"",
    sumber:"Hasil Rapat",meeting_id:m.id,bukti:[],catatan:tl.pic?("PIC: "+tl.pic):"",dibuat_pada:new Date().toISOString()};

function calGeser(n){

  else UI.calCursor=v==="minggu"?addDays(UI.calCursor,7*n):isoAddMonth(UI.calCursor,n);

function isoAddMonth(s,n){const d=fromISO(s);d.setDate(1);d.setMonth(d.getMonth()+n);return iso(d);}
async function aiPresensi(){
  const dasar=UI.gen.presensi||buatPresensi(UI.date);
  if(!dasar){toast(L("toast.nothingToSummarize"));return;}
  const IR=itemRekap(UI.date);
  const fakta=IR.kandidat.map(t=>({judul:t.judul,status:t.status,output:t.output||""}))
    .concat(IR.keg.map(k=>({judul:k.teks,status:"Agenda",output:""})));
  /* Contoh gaya dari Simpan Revisi. Isinya hanya jadi CONTOH POLA, bukan bahan kalimat —
     penjaga angka di bawah tetap menolak keluaran yang memuat angka di luar fakta. */
  const contohGaya=(META.gaya||[]).slice(-GAYA_CONTOH);
  const prompt='Perhalus diksi laporan pekerjaan harian ASN berikut agar formal dan baku (ragam administrasi pemerintahan Indonesia).\n\n'+
   'ATURAN MUTLAK:\n1. JANGAN menambah, menggabungkan ulang, atau menghapus kegiatan. Jumlah baris harus SAMA PERSIS dengan masukan.\n'+
   '2. JANGAN memunculkan angka, nama, atau instansi baru.\n3. Setiap baris satu kalimat, diawali kata kerja aktif me- (Menyusun, Menelaah, Mengikuti, Mereviu, Melaksanakan), diakhiri titik.\n'+
   '4. Maksimal 110 karakter per baris.\n\nDAFTAR KEGIATAN (sumber kebenaran):\n'+JSON.stringify(fakta)+'\n\nDRAF:\n'+dasar+'\n\n'+
   (contohGaya.length?'CONTOH GAYA PENGGUNA (kiri = draf mesin, kanan = perbaikan yang ia inginkan). Tiru POLA diksinya, JANGAN menyalin isinya ke dalam jawaban:\n'+
     contohGaya.map(g=>'- "'+g.dari+'" -> "'+g.ke+'"').join('\n')+'\n\n':'')+
   'Balas HANYA JSON: {"baris":["...","..."]}';
  const jml=dasar.split("\n").length;
  const r=await aiJson(prompt,"quick");
  if(r&&Array.isArray(r.baris)&&r.baris.length===jml){
    const izin=angkaDari(fakta); izin.add(String(jml));
    for(let i=1;i<=5;i++)izin.add(String(i));
    const teks=r.baris.map((b,i)=>(i+1)+". "+rapi(String(b).replace(/^\d+\.\s*/,"")));
    if(lolosValidasi(teks.join(" "),izin)){UI.gen.presensi=teks.join("\n");UI.gen.draf=UI.gen.presensi;toast(L("toast.aiPolished"));}
    else toast(L("toast.aiForeignNumber"));
  } else if(r) toast(L("toast.aiLineMismatch"));
  openModal(tutupHariHTML(UI.date,false));
}

   dan dibuang sendiri setelah animasinya habis — tidak ada yang menumpuk di DOM. */
const RIPPLE_SEL=".btn,.iconbtn,.navbtn,.x,.tick,.seg button,.langseg button,.cday,.kancard,.timerchip";
document.addEventListener("pointerdown",ev=>{
  if(REDUCED.matches||ev.button)return;
  const el=ev.target.closest&&ev.target.closest(RIPPLE_SEL);
  if(!el||el.disabled)return;
  const r=el.getBoundingClientRect();
  if(!r.width||!r.height)return;
  const d=Math.max(r.width,r.height)*2.1;
  const sp=document.createElement("span");
  sp.className="ripple";
  sp.style.cssText="width:"+d+"px;height:"+d+"px;left:"+(ev.clientX-r.left-d/2)+"px;top:"+(ev.clientY-r.top-d/2)+"px";
  el.appendChild(sp);
  setTimeout(()=>{ if(sp.parentNode)sp.parentNode.removeChild(sp); },520);
},{passive:true});

/* ============================ DEMO SEED ============================
   Sample data for the public build. Fictional people, units and documents.
   Runs once, only when the app is completely empty, then never again -- so
   anyone who clears it and starts entering real work keeps their own data.

function demoGeser(rec,hari,medan){

    const v=rec[k]; if(!v) continue;
    const tgl=String(v).slice(0,10);

}
function seedDemoIfEmpty(){
  try{
    if(localStorage.getItem(DEMO_FLAG)) return;
    const kosong=COLLS_DATA.every(c=>D[c].size===0);
    if(!kosong){ localStorage.setItem(DEMO_FLAG,"skip"); return; }
    const hari=Math.round(
      (new Date(todayISO()+"T00:00:00Z")-new Date(DEMO_DATA.anchor+"T00:00:00Z"))
      /86400000);
    const MEDAN={
      tasks:["tanggal","deadline","dibuat_pada","diubah_pada"],
      projects:["tanggal_mulai","target_selesai","diubah_pada"],
      meetings:["tanggal"],
      events:["tanggal"]
    };
    for(const c of ["projects","tasks","meetings","events"]){
      for(const rec of (DEMO_DATA[c]||[])){
        D[c].set(rec.id,demoGeser(Object.assign({},rec),hari,MEDAN[c]));
      }
      lsSet(c);
    }
    for(const rec of SEED_SKP_2026){ D.skp.set(rec.id,Object.assign({},rec)); }
    lsSet("skp");
    localStorage.setItem(DEMO_FLAG,"1");
  }catch(e){ /* a demo that fails to seed must not break the app */ }
}

async function boot(){
  setTimeout(splashTutup,Math.max(0,SPLASH_MAX-performance.now()));
  setInterval(paintTimer,30000);
  document.querySelectorAll("[data-brand]").forEach(el=>{ el.textContent=BRAND[el.getAttribute("data-brand")]||el.textContent; });
  applyTheme(); applyLang();
  hydrateLocal(); seedDemoIfEmpty(); hydrateArsip(); hydrateMeta(); hydrateEkpMeta();
  UI.skpPeriode=todayISO().slice(0,4)+"-TW"+triwulan(todayISO());
  UI.ekpPeriode=UI.skpPeriode;
  UI.gen.presensi="";
  render();
  const [d,s,dl,u]=await Promise.all([cap("db"),cap("sample"),cap("downloads"),cap("user")]);
  db=wrapDb(d); sampleFn=s; dlFn=dl;
  /* PENTING: jangan pernah await apa pun di antara db siap dan subscribeDb(). Bukan cuma
     permissions.request() — db.doc().get() yang pertama pun memicu dialog izin lazy, dan
     janjinya boleh menggantung sampai viewer menjawab. Selama itu onSnapshot tidak pernah
     terpasang dan status macet di "Menghubungkan ke server…". Langganan live dipasang
     LEBIH DULU; pembacaan meta dan pembacaan izin menyusul setelahnya. */
  SYNC.izin=db?"granted":"unavailable";
  render();
  subscribeDb();
  booted=true;
  if(u){ try{ const w=await u.can("data.write"); if(w===false)canWrite=false; }catch(e){} }
  if(db){ try{ const snap=await db.doc("meta/pengaturan").get(); const v=snap&&(typeof snap.data==="function"?snap.data():snap);
    if(v&&Array.isArray(v.kategori))META.kategori=v.kategori; if(v&&Array.isArray(v.unit))META.unit=v.unit; if(v&&Array.isArray(v.rutin))META.rutin=v.rutin; if(v&&Array.isArray(v.gaya))META.gaya=v.gaya; saveMetaLocal(); render(); }catch(e){} }
  if(db){ try{ const snap=await db.doc("meta/ekp").get(); const v=snap&&(typeof snap.data==="function"?snap.data():snap);
    if(v&&typeof v==="object"&&v.pegawai){ EKPMETA=Object.assign(JSON.parse(JSON.stringify(EKP_DEFAULT)),v); saveEkpMetaLocal(); render(); } }catch(e){} }
  buatRutinHariIni();
  /* Beri jeda supaya snapshot pertama sempat mendarat. Kalau purge jalan lebih dulu,
     yang dihapus lokal akan dikirim balik oleh server dan sapuannya jadi sia-sia. */
  setTimeout(sapuSampah,5000);
  cap("permissions").then(async perm=>{
    if(!perm)return;
    try{ SYNC.izin=await perm.state("db"); render(); }catch(e){}
  });
  render();
}
/* Dokumentasi kapabilitas db sendiri bilang: kalau bridge live (onSnapshot) macet di suatu
   tampilan, satu-satunya pemulihan adalah berlangganan ULANG dari awal — bukan menunggu.
   Jadi ini dipisah agar bisa dipanggil ulang dari tombol refresh, bukan cuma sekali saat boot. */
let UNSUBS=[];
let SUBSIZE=0;   /* indeks PAGE_SIZES yang sedang dipakai langganan */
let RESUBAT=0;   /* penjaga: 5 koleksi gagal bersamaan tidak boleh menurunkan ukuran 5x */
let SUBWATCH=null, SUBTRY=0;
/* Langganan yang menggantung tidak memanggil next maupun error — tidak ada apa pun yang
   bisa kita tangkap. Satu-satunya cara tahu ia mati adalah menunggu snapshot pertama yang
   tidak pernah datang. Kontrak menyebut berlangganan ULANG dari awal sebagai satu-satunya
   pemulihan, jadi itu yang dicoba; kalau tetap diam, statusnya berhenti berbohong. */
function armWatchdog(){
  if(SUBWATCH)clearTimeout(SUBWATCH);
  SUBWATCH=setTimeout(()=>{
    SUBWATCH=null;
    if(SYNC.terhubung)return;
    if(SUBTRY<2){ SUBTRY++; subscribeDb(); return; }
    SYNC.terhubung=false;
    SYNC.err="timeout — langganan tidak pernah mengirim snapshot pertama setelah "+(SUBTRY+1)+" percobaan";
    render();
  },12000);
}
function subscribeDb(){
  UNSUBS.forEach(u=>{ try{u();}catch(e){} }); UNSUBS=[];
  if(!db)return;
  const n=PAGE_OK||PAGE_SIZES[Math.min(SUBSIZE,PAGE_SIZES.length-1)];
  COLLS.forEach(c=>{
    try{
      const unsub=db.collection(c).limit(n).onSnapshot(snap=>{
        if(SUBWATCH){ clearTimeout(SUBWATCH); SUBWATCH=null; }
        SUBTRY=0;
        const m=new Map(); snap.docs.forEach(doc=>{ m.set(doc.id,salinDoc(doc.data(),doc.id)); });
        if(m.size||D[c].size===0||snap.metadata.fromCache===false){ D[c]=m; lsSet(c); }
        PAGE_OK=n; SYNC.terhubung=true; SYNC.err="";
        if(snap.metadata.fromCache===false)SYNC.terakhir=new Date().toISOString();
        render();
      },e=>{
        const inf=errInfo(e);
        /* Ditolak karena ukuran halaman, bukan karena server bermasalah: turunkan dan
           berlangganan ULANG dari awal — kontrak menyebut itu satu-satunya pemulihan. */
        if((inf.kode==="invalid_argument"||inf.kode==="resource_exhausted")&&SUBSIZE<PAGE_SIZES.length-1){
          const now=Date.now();
          if(now-RESUBAT>1000){ RESUBAT=now; SUBSIZE++; setTimeout(subscribeDb,300); }
          return;
        }
        SYNC.terhubung=false; SYNC.err=inf.teks;
        toast(L("sync.errPrefix")+inf.teks+")"); render();
      });
      UNSUBS.push(unsub);
    }catch(e){ SYNC.err=errInfo(e).teks; render(); }
  });
  armWatchdog();
}
/* "unavailable" adalah kondisi transient di sisi platform (bukan bug kita) — kontrak db
   secara eksplisit minta dicoba ulang SEKALI setelah jeda singkat, bukan langsung menyerah.
   Satu koleksi gagal juga tidak boleh menghentikan koleksi lain ikut dicoba. */

/* JANGAN kolapskan error jadi "unavailable". Kode itu punya arti spesifik di kontrak db
   (transient, layak retry). Kalau setiap error tanpa properti .code ikut dilabeli begitu,
   invalid_argument/resource_exhausted/not_granted jadi tak terbedakan dan kita menebak-nebak
   penyebabnya. Simpan kode aslinya untuk logika, dan pesan aslinya untuk dibaca manusia. */
function errInfo(e){
  const kode=(e&&e.code)||(e&&e.name)||"unavailable";
  const pesan=(e&&e.message)?String(e.message).slice(0,160):"";
  return {kode:kode, teks:kode+(pesan?" — "+pesan:"")};
}

/* INI BUG YANG SEBENARNYA MEMATIKAN SINKRONISASI SELAMA DUA HARI.
   Kontrak db: "Delivered snapshots and their data() are FROZEN ... clone a body before
   editing it." Kode lama menulis v.id=doc.id langsung ke objek beku itu. Berkas ini pakai
   "use strict", jadi penugasan ke properti read-only MELEMPAR TypeError — bukan gagal diam.
   Lemparan itu terjadi di dalam callback next() pada dokumen PERTAMA, dan karena ia
   TypeError biasa (bukan DbError), callback error() onSnapshot tidak ikut terpanggil.
   Dua-duanya diam → status abadi "Menghubungkan ke server…". Menulis tidak pernah kena
   karena jalur tulis tidak menyentuh objek beku; hanya membaca yang mati.
   Salinan DALAM, bukan Object.assign: pembekuan ikut ke objek dan array bersarang, jadi
   mutasi menyusul seperti task.bukti.push(...) atau o.diubah_pada=... akan melempar juga. */
function salinDoc(raw,id){
  let v;
  try{ v=JSON.parse(JSON.stringify(raw||{})); }
  catch(e){ v=Object.assign({},raw||{}); }
  v.id=id;
  return v;
}

/* INI AKAR MASALAHNYA. Kontrak db menjanjikan setiap panggilan berakhir resolve atau reject.
   Kenyataannya, kalau jembatan postMessage ke frame induk berhenti menjawab, janjinya TIDAK
   PERNAH selesai — bukan ditolak, hanya menggantung selamanya. Akibatnya:
     - onSnapshot tidak memanggil next MAUPUN error, jadi status macet "Menghubungkan…"
     - refreshSync berhenti di await, jadi spinner berputar tanpa akhir
     - SEMUA penanganan error di bawah jadi percuma, karena tidak pernah dijalankan
   Tidak ada penanganan error yang bisa menangkap ketiadaan jawaban. Yang dibutuhkan batas
   waktu. Setiap panggilan db dibalut ini supaya hang berubah jadi kegagalan yang terbaca. */
const DB_TIMEOUT=8000;
function withTimeout(p,ms,label){
  return new Promise((resolve,reject)=>{
    let beres=false;
    const t=setTimeout(()=>{
      if(beres)return; beres=true;
      reject({code:"timeout",message:(label||"panggilan db")+" tidak dijawab dalam "+Math.round((ms||DB_TIMEOUT)/1000)+" detik (jembatan artifact diam)"});
    },ms||DB_TIMEOUT);
    Promise.resolve(p).then(
      v=>{ if(beres)return; beres=true; clearTimeout(t); resolve(v); },
      e=>{ if(beres)return; beres=true; clearTimeout(t); reject(e); }
    );
  });
}

/* Ada belasan pemanggil db.doc() di berkas ini. Menambal batas waktu satu per satu pasti
   menyisakan yang terlewat, jadi pagarnya dipasang sekali di sini. Namespace db milik
   platform dan dibekukan — kontraknya melarang menimpa anggotanya, tapi membolehkan
   MEMBUNGKUSNYA dalam objek sendiri. Itu yang dilakukan di bawah. Jalur collection()
   sengaja diteruskan apa adanya: pembacaannya sudah berpagar di bacaKoleksi() dan
   langganannya dijaga armWatchdog(), keduanya butuh objek query aslinya. */
function wrapDb(raw){
  if(!raw)return null;
  return {
    doc:function(p){
      const r=raw.doc(p);
      return {
        id:r.id, path:r.path,
        get:function(){ return withTimeout(r.get(),DB_TIMEOUT,"baca "+p); },
        set:function(d){ return withTimeout(r.set(d),DB_TIMEOUT,"tulis "+p); },
        update:function(d){ return withTimeout(r.update(d),DB_TIMEOUT,"ubah "+p); },
        delete:function(){ return withTimeout(r.delete(),DB_TIMEOUT,"hapus "+p); },
        acquire:function(o){ return withTimeout(r.acquire(o),DB_TIMEOUT,"kunci "+p); },
        onSnapshot:function(n,e){ return r.onSnapshot(n,e); },
        collection:function(sp){ return raw.collection(p+"/"+sp); }
      };
    },
    collection:function(p){ return raw.collection(p); }
  };
}

/* Ukuran halaman baca. Kontrak menyebut limit() sah di 1–1000, tapi batas efektif runtime
   bisa lebih rendah; kalau ditolak karena ukuran, turun bertahap alih-alih menyerah.
   Ukuran yang terbukti diterima dipakai ulang supaya tidak menabrak batas berulang kali. */
const PAGE_SIZES=[1000,200,50];
let PAGE_OK=null;
async function bacaKoleksi(c){
  const urut=PAGE_OK?[PAGE_OK]:PAGE_SIZES;
  let errTerakhir=null;
  for(const n of urut){
    try{
      const snap=await withTimeout(db.collection(c).limit(n).get(),DB_TIMEOUT,"baca koleksi "+c+" (limit "+n+")");
      PAGE_OK=n;
      return {ok:true, snap:snap};
    }catch(e){
      errTerakhir=e;
      const kode=errInfo(e).kode;
      /* timeout ikut dicoba dengan halaman lebih kecil: muatan balasan yang terlalu besar
         untuk jembatan adalah salah satu sebab jawaban tidak pernah sampai. */
      if(kode==="invalid_argument"||kode==="resource_exhausted"||kode==="timeout")continue;
      break;
    }
  }
  return {ok:false, err:errTerakhir};
}
function serapSnap(c,snap){
  const m=new Map(); snap.docs.forEach(d=>{ m.set(d.id,salinDoc(d.data(),d.id)); });
  D[c]=m; lsSet(c); return m.size;
}
async function ambilKoleksi(c){
  for(let percobaan=0;percobaan<2;percobaan++){
    const r=await bacaKoleksi(c);
    if(r.ok){ serapSnap(c,r.snap); return {ok:true}; }
    const inf=errInfo(r.err);
    if(inf.kode==="unavailable"&&percobaan===0){ await new Promise(r2=>setTimeout(r2,400+Math.random()*400)); continue; }
    return {ok:false, kode:inf.teks};
  }
}
async function refreshSync(){
  const btn=$("#btn-sync"); if(btn)btn.classList.add("spin");
  /* Spinner WAJIB berhenti apa pun yang terjadi. Sebelumnya ia hanya dilepas di baris
     terakhir, jadi satu await yang menggantung membuatnya berputar selamanya — dan itulah
     gejala yang menunjukkan fungsi ini berhenti di tengah jalan, bukan gagal. */
  try{
    if(!db){ db=wrapDb(await cap("db")); }
    if(!db){ toast(L("sync.noDb")); return; }
    let sukses=0, kodeGagalTerakhir="";
    for(const c of COLLS){
      const r=await ambilKoleksi(c);
      if(r.ok)sukses++; else kodeGagalTerakhir=r.kode;
    }
    if(sukses===COLLS.length){ SYNC.terhubung=true; SYNC.err=""; SYNC.terakhir=new Date().toISOString(); toast(L("sync.pullDoneManual")); }
    else if(sukses>0){ SYNC.terhubung=true; SYNC.err=""; SYNC.terakhir=new Date().toISOString(); toast(sukses+"/"+COLLS.length+L("sync.pullPartial")+kodeGagalTerakhir+")"); }
    else { SYNC.terhubung=false; SYNC.err=kodeGagalTerakhir; toast(L("sync.errPrefix")+kodeGagalTerakhir+")"); }
    render();
    SUBTRY=0; subscribeDb();
  }catch(e){
    SYNC.terhubung=false; SYNC.err=errInfo(e).teks;
    toast(L("sync.errPrefix")+SYNC.err+")");
  }finally{
    render();
    if(btn)btn.classList.remove("spin");
  }
}
boot();
</script>
